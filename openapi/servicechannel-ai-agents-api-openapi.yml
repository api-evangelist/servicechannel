openapi: 3.2.0
info:
  version: '3'
  title: ServiceChannel API - v.3 AI Agents API
  description: The ServiceChannel API is a RESTful and stateless API.
servers:
- url: https://sb2api.servicechannel.com/v3
security:
- oauth2: []
tags:
- name: AI Agents
paths:
  /aiagents/locations/{locationId}/InitConversation:
    get:
      tags:
      - AI Agents
      summary: Initializes a new conversation with the necessary setup by creating and…
      operationId: GETv3_aiagents_locations_{locationId}_InitConversation?setupId={setupId}
      parameters:
      - name: locationId
        in: path
        description: The unique identifier of the location.
        required: true
        schema:
          type: integer
          format: int32
      - name: setupId
        in: query
        description: The identifier of the dashboard setup.
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Request succeeded and the requested information is in the response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.AzureOpenAI.Assistant.ChatSessionModel'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.AzureOpenAI.Assistant.ChatSessionModel'
        '400':
          description: "Access denied.\n            <br>Error codes:\n            1000 - The setupId does not belong to the Subscriber;"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
        '401':
          description: "Indicates that the requested resource requires authentication.\n            <br>Error codes:\n            504 - API call rejected by security permissions;"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
        '403':
          description: "You are not authorized to request this resource, or the resource is unavailable for some reason.\n            <br/>Error codes: \n            100 — User has no rights to perform this action."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
        '500':
          description: "The server was unable to complete the request due to an internal error.\n            <br/>Error codes:\n            501 - Unspecified internal server error occurred"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
      deprecated: false
      x-access: Subscribers
  /aiagents/SendMessage:
    post:
      tags:
      - AI Agents
      summary: Sends a message to the specified thread.
      operationId: POSTv3_aiagents_SendMessage?threadId={threadId}&message={message}
      parameters:
      - name: threadId
        in: query
        description: The unique identifier of the conversation.
        required: true
        schema:
          type: string
      - name: message
        in: query
        description: The content of the message to be sent.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Indicates that the message has been sent.
        '400':
          description: The request is not accepted due to bad syntax, missing parameters, insufficient data, etc.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
        '401':
          description: "Indicates that the requested resource requires authentication.\n            <br>Error codes:\n            504 - API call rejected by security permissions;"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
        '500':
          description: "The server was unable to complete the request due to an internal error.\n            <br/>Error codes:\n            501 - Unspecified internal server error occurred"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
      deprecated: false
      x-access: Subscribers
  /aiagents/SendImage:
    post:
      tags:
      - AI Agents
      summary: Sends an image to the specified thread.
      operationId: POSTv3_aiagents_SendImage?threadId={threadId}&setupId={setupId}
      parameters:
      - name: threadId
        in: query
        description: The unique identifier of the conversation.
        required: true
        schema:
          type: string
      - name: setupId
        in: query
        description: The identifier of the dashboard setup.
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Indicates that the image data has been sent.
        '401':
          description: "Indicates that the requested resource requires authentication.\n            <br>Error codes:\n            504 - API call rejected by security permissions;"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
        '500':
          description: "The server was unable to complete the request due to an internal error.\n            <br/>Error codes:\n            501 - Unspecified internal server error occurred"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
      deprecated: false
      x-access: Subscribers
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: Photo to attach the conversation
                  format: binary
              required:
              - file
  /aiagents/locations/{locationId}/ProcessMessageStream:
    get:
      tags:
      - AI Agents
      summary: Retrieves a stream of messages for a specific thread.
      operationId: GETv3_aiagents_locations_{locationId}_ProcessMessageStream?setupId={setupId}&threadId={threadId}&assistantId={assistantId}&enableMetrics={enableMetrics}
      parameters:
      - name: locationId
        in: path
        description: The unique identifier of the location.
        required: true
        schema:
          type: integer
          format: int32
      - name: setupId
        in: query
        description: The identifier of the dashboard setup.
        required: true
        schema:
          type: integer
          format: int32
      - name: threadId
        in: query
        description: The unique identifier of the conversation.
        required: true
        schema:
          type: string
      - name: assistantId
        in: query
        description: The unique identifier of the AI agent.
        required: true
        schema:
          type: string
      - name: enableMetrics
        in: query
        description: Indicates whether metrics should be enabled. Defaults to false if not specified.
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Message stream successfully received.
        '401':
          description: "Indicates that the requested resource requires authentication.\n            <br>Error codes:\n            504 - API call rejected by security permissions;"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
      deprecated: false
      x-access: Subscribers
  /aiagents/DeleteConversation:
    delete:
      tags:
      - AI Agents
      summary: Deletes a specific conversation from the system.
      operationId: DELETEv3_aiagents_DeleteConversation?threadId={threadId}
      parameters:
      - name: threadId
        in: query
        description: The unique identifier of the thread to be deleted.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Indicates that the conversation has been deleted.
        '400':
          description: "Bad Request - the request could not be understood or was missing required parameters.\n            <br/>Error codes:\n            <br/> 503 - Request is invalid"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
        '401':
          description: "Indicates that the requested resource requires authentication.\n            <br>Error codes:\n            504 - API call rejected by security permissions;"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
      deprecated: false
      x-access: Subscribers
  /aiagents/CreateConversation:
    post:
      tags:
      - AI Agents
      summary: Creates a new conversation instance
      operationId: POSTv3_aiagents_CreateConversation
      responses:
        '201':
          description: Indicates that the conversation has been created.
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        '400':
          description: "Bad Request - the request could not be understood or was missing required parameters.\n            <br/>Error codes:\n            <br/> 503 - Request is invalid"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
        '401':
          description: "Indicates that the requested resource requires authentication.\n            <br>Error codes:\n            504 - API call rejected by security permissions;"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:

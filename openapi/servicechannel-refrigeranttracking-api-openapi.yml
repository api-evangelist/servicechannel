  /refrigeranttracking/BulkLeakrecords:
    post:
      tags:
      - RefrigerantTracking
      summary: Update multiple leak records for a work order and an asset
      description: "Creates, updates, or deletes multiple leak records for the **work order + asset** pair.\r\n            <br />***Note:*** Leak records should belong to a unique pair of **WO + asset** to perform bulk operations with them. \r\n            <br />***Note:*** Available with the *RTMultiLeakFlow* feature flag.\r\n            <br />**Example request for adding multiple leak records:**\r\n            \r\n                { \r\n                    \"AddItems\": [\r\n                        {\r\n                        \"RepairDate\": \"2022-09-18T11:53:48.741Z\",\r\n                        \"InitialVerificationDate\": \"2022-09-18T11:53:48.741Z\",\r\n                        \"InitialVerificationMethod\": 2,\r\n                        \"FollowUpVerificationDate\": \"2022-09-18T11:53:48.741Z\",\r\n                        \"FollowUpVerificationMethod\": 2,\r\n                        \"ActionCodeId\": 2,\r\n                        \"FaultCodeId\": 2,\r\n                        \"LeakLocationId\": 2,\r\n                        \"Notes\": [\r\n                            \"leak record 1\"\r\n                            ],\r\n                        \"RecId\": 204762085,\r\n                        \"AssetId\": 5490153,\r\n                        \"Actor\": \"Sam Drill\"\r\n                        },\r\n                        {\r\n                        \"RepairDate\": \"2022-09-19T11:53:48.741Z\",\r\n                        \"InitialVerificationDate\": \"2022-09-19T11:53:48.741Z\",\r\n                        \"InitialVerificationMethod\": 1,\r\n                        \"FollowUpVerificationDate\": \"2022-09-19T11:53:48.741Z\",\r\n                        \"FollowUpVerificationMethod\": 1,\r\n                        \"ActionCodeId\": 1,\r\n                        \"FaultCodeId\": 1,\r\n                        \"LeakLocationId\": 1,\r\n                        \"Notes\": [\r\n                            \"leak record 2\"\r\n                            ],\r\n                        \"RecId\": 204762085,\r\n                        \"AssetId\": 5490153,\r\n                        \"Actor\": \"Derek Crown\" \r\n                        ],\r\n                     \"RecId\": 204762085,\r\n                     \"AssetId\": 5490153\r\n                }"
      operationId: POSTv3_refrigeranttracking_BulkLeakrecords
      consumes:
      - application/json
      - text/json
      produces:
      - application/json
      - text/json
      parameters:
      - name: request
        in: body
        description: Request model to perform bulk operations with multiple leak records for the work order and an asset.
        required: true
        schema:
          $ref: '#/definitions/ServiceChannel.Services.Messaging.RefrigerantTracking.LeakImmeasurableBulkChangeRequest'
      responses:
        '200':
          description: The specified leak records have been successfully modified.
          schema:
            $ref: '#/definitions/ServiceChannel.Services.Core.InternalRequests.RefrigerantTracking.LeakImmeasurableBulkChangeRequestInternal'
        '400':
          description: "The request was not accepted due to bad syntax, missing parameters, insufficient data, etc.\r\n            <br/>Error codes:\r\n            503 &mdash; Asset is not attached to a work order\r\n            503 &mdash; Asset is not refrigerant \r\n            503 &mdash; Asset ID and work order ID are required\r\n            503 &mdash; Asset doesn't exist \r\n            503 &mdash; Actor length cannot be more than 50 symbols \r\n            503 &mdash; There are uncompleted leak records in another WO \r\n            503 &mdash; Follow-up verification date cannot be earlier than the initial verification date and later than the work order completion date or the scheduled date \r\n            503 &mdash; Initial verification date can't be less than the repair date and more than the work order completion date or scheduled date \r\n            503 &mdash; Verification data cannot be entered without the leak location \r\n            503 &mdash; Repair date cannot be earlier than the work order call date and later than the work order completion date  \r\n            503 &mdash; Repair date is required\r\n            503 &mdash; Fault code ID is required \r\n            503 &mdash; Action code ID is required \r\n            503 &mdash; Action сode ID is not found \r\n            503 &mdash; Fault code ID is not found \r\n            503 &mdash; Follow-up verification date and method should be entered \r\n            503 &mdash; Initial verification date and method should be entered \r\n            503 &mdash; Work order is in the completed status. Only RT Admins can process leak records on WOs in an invoiceable status \r\n            503 &mdash; To complete a leak record, fill out all the fields \r\n            503 &mdash; Leak immeasurable must be completed. If a work order is already in an invoiceable status or the linked leak event is already completed, all leak record data should be entered \r\n            503 &mdash; Only one WO + asset pair is allowed in the request"
          schema:
            $ref: '#/definitions/ServiceChannel.Services.Messaging.ErrorResponse'
        '500':
          description: "Something went wrong, and the server was unable to complete your request.\r\n            <br>Error codes:\r\n            501 &mdash; Internal Error"
          schema:
            $ref: '#/definitions/ServiceChannel.Services.Messaging.ErrorResponse'
        '503':
          description: The request was not accepted because the user is not a Refrigerant Tracking Admin.
          schema:
            $ref: '#/definitions/ServiceChannel.Services.Messaging.ErrorResponse'
      deprecated: false
      x-access: Any

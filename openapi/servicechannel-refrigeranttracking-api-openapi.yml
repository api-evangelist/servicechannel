  ServiceChannel.Services.Messaging.RefrigerantTracking.AddLeakImmeasurableRequest:
    description: Request model to create a leak record for the work order and asset.
    type: object
    properties:
      RepairDate:
        format: date-time
        description: Date and time when the repair was completed. ***Note:*** It cannot be earlier than the work order call date. The date format is `YYYY-MM-DDThh:mm:ss.sssZ`.
        type: string
      InitialVerificationDate:
        format: date-time
        description: Date when the first verification took place. ***Note:*** The initial verification date cannot be in the future and cannot be less than the repair date. It should be either a current date or a date in the past.
        type: string
      InitialVerificationMethod:
        format: int32
        description: "Method that was used during the first verification to make sure the leak had been fixed. \r\n            <br />Possible values:\r\n             • `0`: Unknown\r\n             • `1`: Soap Bubble Test\r\n             • `2`: Electronic Leak Detection\r\n             • `3`: Ultrasonic Leak Detection\r\n             • `4`: Pressure Test\r\n             • `5`: Vacuum Test\r\n             • `6`: Fluorescent Dye Test\r\n             • `7`: Infrared Test\r\n             • `8`: Near Infrared Test\r\n             • `9`: Halon Gas Detection"
        type: integer
      FollowUpVerificationDate:
        format: date-time
        description: Date of the second verification. The date format is `YYYY-MM-DDThh:mm:ss.sssZ`. ***Note:*** The follow-up verification date cannot be earlier than the initial verification date and cannot be in the future. It should be either a current date or a date in the past.
        type: string
      FollowUpVerificationMethod:
        format: int32
        description: Method of the second verification. The list of available verification methods is the same as for the `InitialVerificationMethod`.
        type: integer
      ActionCodeId:
        format: int32
        description: Unique numeric identifier of the action that a technician took to fix the leak. Use the [GET/refrigeranttracking/leakRecord/actionCodes](https://developer.servicechannel.com/swagger/index.html#/RefrigerantTracking/GETv3_refrigeranttracking_leakRecord_actionCodes) method to get available action codes and their IDs.
        type: integer
      FaultCodeId:
        format: int32
        description: "Unique numeric identifier of the reason why the problem occurred. Use the [GET/refrigeranttracking/leakRecord/faultCodes](https://developer.servicechannel.com/swagger/index.html#/RefrigerantTracking/GETv3_refrigeranttracking_leakRecord_faultCodes) method to get available fault codes and their IDs.\r\n            <br />Possible values:\r\n             • `1`: Accidental Damage\r\n             • `2`: Braze or Joint Failure\r\n             • `3`: Corrosion\r\n             • `4`: Defrost Heater Failure\r\n             • `5`: Faulty Part\r\n             • `6`: Forklift Damage\r\n             • `7`: Gasket Seal Failure\r\n             • `8`: Ice Build Up\r\n             • `9`: Line Break\r\n             • `10`: Manufacture Defect\r\n             • `11`: Missing Part\r\n             • `12`: Natural Disaster\r\n             • `13`: Normal Mechanical Wear\r\n             • `14`: Other (Must Explain in Comments)\r\n             • `15`: Vandalism\r\n             • `16`: Vibration Related\r\n             • `17`: Project Related Loss"
        type: integer
      LeakLocationId:
        format: int32
        description: 'Unique numeric identifier of the location where the leak occurred: more specific place within the particular area, for example, *Coil*, *Level Indicator/Alarm*, *Splitting Valve*. Use the [GET/refrigeranttracking/{subscriberId}/leaklocations](https://developer.servicechannel.com/swagger/index.html#/RefrigerantTracking/GETv3_refrigeranttracking_%7BsubscriberId%7D_leaklocations) method to get the list of available leak locations.'
        type: integer
      Notes:
        description: Leak record notes.
        type: array
        items:
          type: string
      RecId:
        format: int32
        description: Unique numeric identifier of the work order to add the leak record to.
        type: integer
      AssetId:
        format: int32
        description: Unique numeric identifier of the asset to add the leak record to.
        type: integer
      Actor:
        description: Name of the technician who performed the fix of the leak.
        type: string

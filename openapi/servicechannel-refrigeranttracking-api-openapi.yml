  ServiceChannel.Services.Messaging.RefrigerantTracking.RefrigerantSettings.RefrigerantSettingsUS:
    description: Object containing refrigerant tracking settings for US companies
    type: object
    properties:
      UnitsOfMeasure:
        format: byte
        description: "Unit of measure for tracking refrigerant use.\r\n            <br />The possible response values:\r\n             • `0`: Pounds and decimals of pounds\r\n             • `1`: Pounds and ounces\r\n             • `2`: Kilograms and grams\r\n            <br />***Note***: To use kilograms and grams as a unit of measure, turn on the  *RefrigerantSettingsEU* feature flag."
        type: string
      SubscriberId:
        format: int32
        description: Unique numeric identifier of the subscriber.
        type: integer
      InventoryLocation:
        format: byte
        description: "Defines whether technicians can take refrigerant from any inventory location or from the locations in the technician's area only.\r\n            <br />The possible response values:\r\n             • `0`: Only in technician’s area\r\n             • `1`: Any location"
        type: string
      CalculationMethod:
        format: byte
        description: "Preferred method of refrigerant leak calculation:\r\n             • `0`: Annualized\r\n             • `1`: Rolling Average\r\n            <br />Check how each calculation method works in [SCU](https://servicechannel.atlassian.net/wiki/spaces/SCU/pages/2789703925/Refrigerant+Tracking#RefrigerantTracking)."
        type: string
      ChargeThreshold:
        format: double
        description: Minimum amount of refrigerant that a system can contain for leak tracking to occur. The charge threshold value is displayed in the specified unit of measure. Check the `UnitsOfMeasure` parameter value.
        type: number
      ComercialRefTriggerRate:
        format: double
        description: "Minimum percentage of the total system charge that can be lost before refrigerant tracking to occur. This rate is set for commercial refrigeration appliances.\r\n            <br />It applies to asset types with the refrigerant use purpose set to *Commercial Refrigeration*."
        type: number
      IndustrialRefTriggerRate:
        format: double
        description: "Minimum percentage of the total system charge that can be lost before refrigerant tracking to occur. This rate is set for industrial refrigeration appliances.\r\n            <br />It applies to asset types with the refrigerant use purpose set to *Industrial Refrigeration*."
        type: number
      HVACTriggerRate:
        format: double
        description: "Minimum percentage of the total system charge that can be lost before refrigerant tracking to occur. This rate is set for HVAC appliances.\r\n            <br />It applies to asset types with the refrigerant use purpose set to *Comfort Cooling (AC)*."
        type: number
      OthersTriggerRate:
        format: double
        description: "Minimum percentage of the total system charge that can be lost before refrigerant tracking to occur. This trigger rate is set for appliances that don’t fall under any of the following groups: commercial appliances, industrial appliances, HVAC appliances.\r\n            <br />It applies to asset types with the refrigerant use purpose set to *Other Types of Refrigerated Asset*."
        type: number
      Yearly:
        format: double
        description: "Minimum threshold for annual leak inspections. The value defines the minimum system charge required to create an annual PM leak inspection work order if a leak has met or exceeded the EPA leak threshold.\r\n            <br />Check the `UnitsOfMeasure` parameter value to see the corresponding unit of measure."
        type: number
      Quarterly:
        format: double
        description: "Minimum threshold for quarterly leak inspections. The value defines the minimum system charge required to create quarterly PM leak inspection work orders if a leak has met or exceeded the EPA leak threshold. \r\n            <br />Check the `UnitsOfMeasure` parameter value to see the corresponding unit of measure."
        type: number
      RunCARBReport:
        description: "Refrigerant tracking preference that allows subscribers to run the California Air Resources Board report.\r\n            <br />The possible response values:\r\n             • `true`: The CARB reporting is activated for the subscriber.\r\n             • `false`: The CARB reporting is deactivated for the subscriber.\r\n            <br />Learn about the CARB reporting in [SCU](https://servicechannel.atlassian.net/wiki/spaces/SCU/pages/710148264/California+Air+Resource+Board+CARB+Reporting)."
        default: false
        type: boolean
      ComplianceAcknowledgmentForAllLeaksRefrigerantUse:
        description: "Compliance acknowledgement message that gets triggered for every reported leak or refrigerant use to confirm that a full inspection has been conducted. \r\n            <br />The possible response values:\r\n             • `true`: The compliance acknowledgement message is enabled in the SC Provider mobile app, Service Automation, and Provider Automation.\r\n             • `false`: The compliance acknowledgement message is deactivated.\r\n            <br />***Note***: The *RefLeakInspectionAcknowledgementAll* feature flag should be turned on."
        default: false
        type: boolean
      DelayedSecondaryVerification:
        description: "Allows subscribers to enforce a time delay between the initial and the secondary verifications when a leak event takes place.\r\n            <br />The possible response values:\r\n             • `true`: Time delay is activated by the subscriber. The number of days is specified for each refrigerant type:\r\n               * `HVACDelayDays`\r\n               * `IndustrialRefrigerationDelayDays`\r\n               * `CommercialRefrigerationDelayDays`\r\n               * `OtherTypesDelayDays`\r\n             • `false`: Time delay is not enabled by the subscriber.\r\n            <br />***Note***: The subscriber should have the *RefrigerationTrackingDelayedSecondaryVerification* feature flag enabled.\r\n            <br />Read more about this feature in [SCU](https://servicechannel.atlassian.net/wiki/spaces/SCU/pages/2789703925/Refrigerant+Tracking#RefrigerantTracking-DelayedSecondaryVerificationDelayedSecondaryVerification)."
        default: false
        type: boolean
      LeakInspectionNTE:
        format: double
        description: Default not-to-exceed (NTE) amount for all PM work orders generated for quarterly and annual follow-up leak inspections.
        type: number
      RefrigerationPriorityName:
        description: Priority name for Planned Maintenance work orders that are automatically generated for follow-up leak inspections.
        type: string
      EmailNotificationEnable:
        description: "Allows subscribers to create an email notification that will be sent to the specified recipients when the amount of refrigerant added by a technician meets or exceeds the system total charge.\r\n            <br />The possible response values:\r\n             • `false`: The email notification is not enabled by the subscriber.\r\n             • `true`: The email notification is enabled. The recipients and the message text are specified in the response. When the response value is `true`, check the `EmailNotification` object."
        default: false
        type: boolean
      EmailNotification:
        $ref: '#/definitions/ServiceChannel.Services.Messaging.RefrigerantTracking.RefrigerantSettings.EmailNotification'
      GenerateFollowUpWorkOrder:
        format: byte
        description: "Defines whether a follow-up work order should be generated when there is an open leak, and the provider wants to close the original work order.\r\n            <br />The possible response values:\r\n             • `0`: No follow-up work orders should be generated. The work order cannot be closed and invoiced until the leak record is closed. The *Never* option is set by the subscriber for the **Follow-Up Work Order** setting in Refrigerant Tracking Admin.\r\n             • `1`: A follow-up work order can be generated for the provider to close the leak record. The *Open Leak* option is set by the subscriber for the **Follow-Up Work Order** setting in Refrigerant Tracking Admin.\r\n            <br />***Note***: If the *Open Leak* option is not available for the subscriber, try turning the *RTMultiLeakFollowUp* feature flag on."
        type: string
      Compliance:
        description: "Shows the region to which the configured refrigerant tracking settings get applied, following the compliance requirements.\r\n            <br />The possible response values:\r\n             • `US`: Refrigerant tracking compliance for the USA\r\n             • `EU`: Refrigerant tracking compliance for the European Union\r\n             • `CA`: Refrigerant tracking compliance for Canada"
        type: string
      MaxLocCount:
        format: int32
        description: Maximum number of locations where refrigerant tracking should be recorded. It relates to the `RtLimitedAppliance` parameter.
        type: integer
      RtLimitedAppliance:
        format: byte
        description: "Specifies whether refrigerant tracking should happen across all locations or at those where it’s required.\r\n            <br />The possible response values:\r\n             • `0`: Across all locations\r\n             • `1`: For limited locations only\r\n            <br />When the response returns `1`, check the related `MaxLocCount` parameter to learn the max number of locations."
        type: string
      Settings:
        description: Refrigerant tracking preferences configured for the subscriber.
        type: string
      RefrigerantTrackingProviderId:
        format: int32
        description: Unique numeric identifier of the provider who is assigned retrofit and retirement work orders, as well as work orders created in the event of adding a refrigerant part use record from the asset details page.
        type: integer
      GenerateLeakInspectionOption:
        format: byte
        description: "Specifies which refrigerant types require PM leak inspection work orders: only ODS (Ozone Depleting Substance) refrigerant types or all refrigerant types.\r\n            <br />The possible response values:\r\n             • `0`: For all refrigerant types\r\n             • `1`: For ODS refrigerant types"
        type: string
      OpenLeakNotificationSettings:
        $ref: '#/definitions/ServiceChannel.Services.Messaging.RefrigerantTracking.RefrigerantSettings.OpenLeakNotificationSettings'
        description: Settings for configuring email alerts about open leaks.
      EnableCARBInspections:
        description: "Shows whether the subscriber has activated PM leak inspections for appliances tracked by CARB (California Air Resources Board).\r\n            <br />The possible response values:\r\n             • `true`: PM leak inspections are enabled for appliances tracked by CARB. When the parameter is `true`, check the related parameters:\r\n               * `DateFormat`\r\n               * `CalendarStartDate`\r\n               * `CalendarStartDateStr`\r\n             • `false`: PM leak inspections are deactivated for appliances tracked by CARB."
        default: false
        type: boolean
      DateFormat:
        description: Date format applied to the `CalendarStartDate` parameter.
        type: string
      CalendarStartDate:
        format: date-time
        description: "Date that becomes a call date for all CARB leak inspection PM work orders. The date format is YYYY-MM-DDThh:mm:ss.\r\n            <br />Check the `EnableCARBInspections` parameter for more information."
        type: string
      CalendarStartDateStr:
        description: Date that becomes a call date for all CARB leak inspection PM work orders. The date format is MMM DD, YYYY.
        type: string
        readOnly: true
      LeakInspectionPMGenerationAdvanceTimeframe:
        format: int32
        description: Number of days to generate PM leak inspection work orders in advance upon identifying a leak. The default value is 7 days.
        type: integer
      LeakInspectionPMGenerationAdvanceAppliedToExistingPMs:
        format: byte
        type: string
      LeakInspectionCategoryId:
        format: int32
        description: Unique numeric identifier of the category for PM leak inspection work orders.
        type: integer
      SCProviderMessageEnable:
        description: "Shows whether the subscriber has enabled the compliance acknowledgment message to be displayed for providers in the SC Provider mobile app. Providers receive the message when checking out of PM leak inspection work orders with at least one refrigerated asset.\r\n            <br />The possible response values:\r\n             • `true`: The acknowledgement message is enabled.\r\n             • `false`: The acknowledgement message is deactivated.\r\n            <br />Read about the related `SCProviderMessage` parameter to view the message text.\r\n            <br />***Note***: The *RefLeakInspectionAcknowledgement* and *RTMultiLeakFlow* feature flags should be turned on."
        default: false
        type: boolean
      ServiceAutomationMessageEnable:
        description: "Shows whether the subscriber has enabled the compliance acknowledgment message to be displayed for subscribers in Service Automation. The message appears when subscribers are entering leak verification information for PM leak inspection work orders with at least one refrigerated asset.\r\n            <br />The possible response values:\r\n             • `true`: The message is enabled.\r\n             • `false`: The message is deactivated.\r\n            <br />Check the related `ServiceAutomationMessage` parameter to view the message text.\r\n            <br />***Note***: The *RefLeakInspectionAcknowledgement* and *RTMultiLeakFlow* feature flags should be turned on."
        default: false
        type: boolean
      ProviderAutomationMessageEnable:
        description: "Shows whether the subscriber has enabled the compliance acknowledgment message to be displayed for providers in Provider Automation. The message is displayed when providers are entering leak verification information for PM leak inspection work orders with at least one refrigerated asset.\r\n            <br />The possible response values:\r\n             • `true`: The acknowledgment message is enabled.\r\n             • `false`: The acknowledgment message is deactivated.\r\n            <br />Check the related `ProviderAutomationMessage` parameter to view the message text.\r\n            <br />***Note***: The *RefLeakInspectionAcknowledgement* and *RTMultiLeakFlow* feature flags should be turned on."
        default: false
        type: boolean
      SCProviderMessage:
        description: Compliance acknowledgement message that is displayed for providers in SC Provider upon checking out of PM leak inspection work orders with at least one refrigerated asset. See the parent `SCProviderMessageEnable` parameter for more details.
        type: string
      ServiceAutomationMessage:
        description: Compliance acknowledgement message that is displayed for subscribers in Service Automation. Subscribers see the message when they are entering leak verification information for PM leak inspection work orders with at least one refrigerated asset.
        type: string
      ProviderAutomationMessage:
        description: Compliance acknowledgement message that is displayed for providers in Provider Automation. Providers see the message when they are entering leak verification information for PM leak inspection work orders with at least one refrigerated asset.
        type: string
      CertificationExceptionRecipients:
        description: "Email addresses of people to be notified whenever technicians specify that they don’t have the required trade certification/license while completing a refrigerant or HVAC work order via SC Provider.\r\n            <br />***Note***: Available with the *RefCertSCP* feature flag."
        type: string
      CertificationExceptionRecipientEmails:
        description: Email addresses of people to be notified whenever technicians specify that they don’t have the required trade certification/license while completing a refrigerant or HVAC work order via SC Provider. Available with the RefCertSCP feature flag.
        type: array
        items:
          type: string
        readOnly: true
      HVACDelayDays:
        format: int32
        description: Time delay between the initial and the secondary verifications for HVAC assets. Specified in days.
        type: integer
      IndustrialRefrigerationDelayDays:
        format: int32
        description: Time delay between the initial and the secondary verifications for assets of the industrial refrigeration group. Specified in days.
        type: integer
      CommercialRefrigerationDelayDays:
        format: int32
        description: Time delay between the initial and the secondary verifications for assets of the commercial refrigeration type. Specified in days.
        type: integer
      OtherTypesDelayDays:
        format: int32
        description: Time delay between the initial and the secondary verifications for other types of assets that don’t fall under the industrial refrigeration, commercial refrigeration, or HVAC groups. Specified in days.
        type: integer
      RefrigerationPriorityId:
        format: int32
        type: integer
  ServiceChannel.Services.Messaging.RefrigerantTracking.AddLeakNoteRequest:
    type: object
    properties:
      LeakRecordId:
        format: int32
        type: integer
      Note:
        type: string
      Autogenerated:
        default: false
        type: boolean
  System.Object:
    type: object
    properties: {}
  ServiceChannel.Services.Messaging.RefrigerantTracking.LeakInspectionComplianceAcknowledgement:
    type: object
    properties:
      AssetId:
        format: int32
        type: integer
      VerificationMethodsIds:
        type: array
        items:
          format: int32
          type: integer
      TrackingNumber:
        format: int32
        type: integer
      CertifiedTechnicianId:
        format: int32
        type: integer
      TechnicianCertificateId:
        type: string
      CertificateId:
        format: int32
        type: integer
      Actor:
        type: string
  ServiceChannel.Services.Messaging.RefrigerantTracking.RefrigerantSettings.ThresholdAnnouncement:
    type: object
    properties:
      Id:
        format: int32
        type: integer
      UpcomingChargeThreshold:
        format: double
        type: number
      ApplyDateByFeature:
        format: date-time
        type: string
      Message:
        type: string
      FeatureId:
        format: int32
        type: integer
securityDefinitions:
  oauth2:
    type: oauth2
    description: OAuth2 Authorization
    flow: accessCode
    authorizationUrl: https://sb2login.servicechannel.com/oauth/authorize
    tokenUrl: https://sb2login.servicechannel.com/oauth/token

definitions:
  ServiceChannel.Services.Messaging.RefrigerantTracking.RefrigerantSettings.RefrigerantSettingByLocationItem:
    description: Object containing subscriber’s locations with refrigerant tracking enabled.
    type: object
    properties:
      LocationId:
        format: int32
        description: Unique numeric identifier of the location (generated by the system).
        type: integer
      IsRefrigerantTrackingAvailable:
        description: 'Shows whether the refrigerant tracking settings are enabled for the location. Possible response values: `true` and `false`.'
        default: false
        type: boolean
      UnitsOfMeasure:
        format: int32
        description: "Unit of measure for tracking refrigerant use. Possible response values:\r\n             • `0`: Pounds and decimals of pounds\r\n             • `1`: Pounds and ounces\r\n             • `2`: Kilograms and grams"
        type: integer
  ServiceChannel.Services.Messaging.RefrigerantTracking.UpdateLeakRecordRequest:
    description: Object containing information about the leak event.
    required:
    - Id
    type: object
    properties:
      Id:
        format: int32
        description: Unique numeric identifier of the leak event. Leak event IDs can be found in the **Refrigerant Leak Events** report in Service Automation.
        type: integer
      Note:
        description: Leak record note.
        type: string
      RepairDate:
        format: date-time
        description: Date when the repair was completed. It cannot be earlier than the work order call date. The date format is `YYYY-MM-DDThh:mm:ss.sssZ`.
        type: string
      InitialDate:
        format: date-time
        description: Date when the first leak verification took place. The date format is `YYYY-MM-DDThh:mm:ss.sssZ`. ***Note:*** The initial verification date cannot be in the future. It should be either a current date or a date in the past.
        type: string
      InitialMethod:
        format: int32
        description: "Method that was used during the first verification to make sure the leak had been fixed.\r\n            <br />Possible values:\r\n             • `0`: Unknown \r\n             • `1`: Soap Bubble Test \r\n             • `2`: Electronic Leak Detection \r\n             • `3`: Ultrasonic Leak Detection \r\n             • `4`: Pressure Test \r\n             • `5`: Vacuum Test \r\n             • `6`: Fluorescent Dye Test \r\n             • `7`: Infrared Test \r\n             • `8`: Near Infrared Test \r\n             • `9`: Halon Gas Detection"
        type: integer
      FollowUpDate:
        format: date-time
        description: Date of the second verification. The date format is `YYYY-MM-DDThh:mm:ss.sssZ`. ***Note:*** The follow-up verification date cannot be earlier than the initial verification date and cannot be in the future. It should be either a current date or a date in the past.
        type: string
      FollowUpMethod:
        format: int32
        description: Method of the second verification. The list of available verification methods is the same as for the `InitialMethod`.
        type: integer
      LeakLocationId:
        format: int32
        description: 'Unique numeric identifier of the location where the leak occurred: more specific place within the particular area, for example, *Level Indicator/Alarm*, *Splitting Valve*. Use the [GET/refrigeranttracking/{subscriberId}/leaklocations](https://developer.servicechannel.com/swagger/index.html#/RefrigerantTracking/GETv3_refrigeranttracking_%7BsubscriberId%7D_leaklocations) method to get the list of available leak locations.'
        type: integer
      FaultCodeId:
        format: int32
        description: "Unique numeric identifier of the reason why the problem occurred. Use the [GET/refrigeranttracking/leakRecord/faultCodes](https://developer.servicechannel.com/swagger/index.html#/RefrigerantTracking/GETv3_refrigeranttracking_leakRecord_faultCodes) method to get available fault codes and their IDs. \r\n            <br />Possible values:\r\n             • `1`: Accidental Damage\r\n             • `2`: Braze or Joint Failure\r\n             • `3`: Corrosion\r\n             • `4`: Defrost Heater Failure\r\n             • `5`: Faulty Part\r\n             • `6`: Forklift Damage\r\n             • `7`: Gasket Seal Failure\r\n             • `8`: Ice Build Up \r\n             • `9`: Line Break\r\n             • `10`: Manufacture Defect\r\n             • `11`: Missing Part\r\n             • `12`: Natural Disaster\r\n             • `13`: Normal Mechanical Wear\r\n             • `14`: Other(Must Explain in Comments)\r\n             • `15`: Vandalism \r\n             • `16`: Vibration Related\r\n             • `17`: Project Related Loss"
        type: integer
      ActionCodeId:
        format: int32

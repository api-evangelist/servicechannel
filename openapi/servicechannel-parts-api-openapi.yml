components:
  schemas:
    ServiceChannel.Services.WebApi.Models.Response.WasMaterialUsedResponse:
      type: object
      properties:
        ResponseItems:
          type: array
          items:
            $ref: '#/components/schemas/ServiceChannel.Services.WebApi.Models.Response.WasMaterialUsedApiModel'
    ServiceChannel.Services.Messaging.Inventory.InventoryLocation:
      type: object
      properties:
        Id:
          format: int32
          type: integer
        LocationId:
          format: int32
          type: integer
        PartId:
          format: int32
          type: integer
        Qty:
          format: double
          type: number
        UnitPrice:
          format: double
          type: number
        LocationName:
          type: string
        StoreId:
          type: string
        LocationGuid:
          type: string
    ServiceChannel.Services.Messaging.RefrigerantTracking.WorkOrderPartRefrigerantBulkChangeRequest:
      description: Object for modifying part use records in bulk
      type: object
      properties:
        AddItems:
          type: array
          items:
            $ref: '#/components/schemas/ServiceChannel.Services.Messaging.RefrigerantTracking.AddWorkOrderPartRefrigerantItem'
        UpdateItems:
          type: array
          items:
            $ref: '#/components/schemas/ServiceChannel.Services.Messaging.RefrigerantTracking.UpdateWorkOrderPartRefrigerantItem'
        DeleteItems:
          type: array
          items:
            $ref: '#/components/schemas/ServiceChannel.Services.Messaging.RefrigerantTracking.DeleteWorkOrderPartRefrigerantItem'
        IsLocalTime:
          description: "Specifies whether the `UseDate` should be converted based on the work order location time zone. Possible values:\n             • `true`: `UseDate` will not be converted to the location time zone.\n             • `false`: `UseDate` is provided in UTC (global standard time zone) and automatically converted to the local time zone."
          default: false
          type: boolean
        SubmitQuantityExceeded:
          description: When the part use meets or exceeds the threshold, set the parameter’s value to `true` to be able to proceed with the request.
          default: false
          type: boolean
        SubmitMoeQtyExceeded:
          description: For Canadian locations. When the part use meets or exceeds the threshold, set the parameter’s value to `true` to be able to proceed with the request.
          default: false
          type: boolean
    ServiceChannel.Services.Messaging.Workorders.UpdateWorkOrderPartRequest:
      type: object
      properties:
        Id:
          format: int32
          type: integer
        Quantity:
          format: double
          type: number
        Description:
          type: string
        Price:
          format: double
          type: number
    ServiceChannel.Services.Messaging.Parts.RefrigerantUsageResponse:
      type: object
      properties:
        TriggerQuantity:
          format: double
          type: number
        LeakRate:
          format: double
          type: number
        Charge:
          format: double
          type: number
        CalculationMethod:
          format: byte
          type: string
    ServiceChannel.Services.Messaging.RefrigerantTracking.UpdateWorkOrderPartRefrigerantItem:
      description: Object for updating part use records in bulk
      type: object
      properties:
        PartId:
          format: int32
          description: Unique numeric identifier of the part use record that you want to update. Use the [GET/workorders/{workorderId}/partsUsage](https://developer.servicechannel.com/swagger/index.html#/Parts/GETv3_workorders_%7BworkorderId%7D_partsUsage) method to identify the required part use record ID.
          type: integer
        Quantity:
          format: double
          description: Quantity of parts used.
          type: number
        UnitCost:
          format: double
          description: Cost of each part.
          type: number
        IsRefrigerant:
          description: 'Specifies whether the part you are trying to update is classified as a refrigerant. Possible input values: `true` and `false`.'
          default: false
          type: boolean
        IsInventoryPart:
          description: "Specifies whether the part you are trying to update is listed in the inventory catalog for the location or the part is supplied by the vendor. Possible input values:\n             • `true`: Indicates an inventory part \n             • `false`: Indicates a vendor-supplied part"
          default: false
          type: boolean
        UseDate:
          format: date-time
          description: Date and time when the part was used.
          type: string
        UseDateStr:
          description: Date and time when the part was used.
          type: string
        ReasonCode:
          format: int32
          description: "Reason code name for the refrigerant part use — as configured by the subscriber. Possible values:\n             • `Leak`\n             • `Repair`\n             • `Adjustment`\n             • `System Expansion`\n             • `Removal` \n             • `Initial Charge`\n             • `Retrofit`\n             • `Removed Reused`\n            <br />To get the list of reason codes for the subscriber, use the [GET/refrigeranttracking/{subscriberId}/GetRefrigerantUseReasonCodes](https://developer.servicechannel.com/swagger/index.html#/RefrigerantTracking/GETv3_refrigeranttracking_%7BsubscriberId%7D_GetRefrigerantUseReasonCodes) method."
          type: integer
        ReasonCodeId:
          format: int32
          description: Unique numeric identifier of the refrigerant use reason code. To get the list of reason code IDs for the subscriber, use the [GET/refrigeranttracking/{subscriberId}/GetRefrigerantUseReasonCodes](https://developer.servicechannel.com/swagger/index.html#/RefrigerantTracking/GETv3_refrigeranttracking_%7BsubscriberId%7D_GetRefrigerantUseReasonCodes) method.
          type: integer
        PartNumber:
          description: Part number. Shouldn’t exceed 50 characters.
          type: string
        PartName:
          description: Part name. Shouldn’t exceed 100 characters.
          type: string
        PartGroup:
          description: Part group. Required only if the `IsRefrigerant` is set to `true`.
          type: string
        SupplierName:
          description: Name of a company that supplies the part.
          type: string
        Description:
          description: Part description. Any additional information on the part. Shouldn’t exceed 250 characters.
          type: string
        RefrigerantChargeOptionsId:
          format: int32
          description: "Unique numeric identifier of the charge method used. Possible values:\n             • `1`: Calculation  \n             • `2`: Established\n             • `3`: Manufacturer Tag\n             • `4`: Measurement \n             • `5`: MFG Info (Established Range)\n             • `6`: Onsite Documentation\n             • `7`: Approximate\n            <br />To get charge options and their IDs, use the [GET/refrigeranttracking/ChargeDescriptions](https://developer.servicechannel.com/swagger/index.html#/RefrigerantTracking/GETv3_refrigeranttracking_ChargeDescriptions) method."
          type: integer
        RefrigerantChargeVendor:
          description: Provider who identified the initial charge of the system. Only applicable when the `ReasonCode` is set to `Initial Charge`.
          type: string
        InventoryLocationId:
          format: int32
          description: Unique numeric identifier of the inventory location where the inventory part is stored.
          type: integer
        InventoryLocationGuid:
          description: GUID of the inventory location.
          type: string
        InventoryPartId:
          format: int32
          description: Unique numeric identifier of the inventory part.
          type: integer
        RefrigerantUseReason:
          $ref: '#/components/schemas/ServiceChannel.Services.Messaging.RefrigerantTracking.RefrigerantUseReasonCode'
        SubmitMoeQtyExceeded:
          description: For Canadian locations. When the part use meets or exceeds the threshold, set the parameter’s value to `true` to be able to proceed with the request.
          default: false
          type: boolean
        MoeNumber:
          description: "Agency number that will be assigned to the work order and the leak record. The number can be up to 20 characters. An agency number needs to be entered when the system threshold has been met or exceeded. For Canadian locations only.\n            <br />Available with the *SCP_RTCanadaRefrigeration* feature flag."
          type: string
        RecId:
          format: int32
          description: Unique numeric identifier of the work order associated with the `AssetId`. Only one work order can be processed in the request.
          type: integer

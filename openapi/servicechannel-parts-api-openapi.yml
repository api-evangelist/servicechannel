    ServiceChannel.Services.Messaging.RefrigerantTracking.RefrigerantUseReasonCode:
      description: Object containing refrigerant use reasons.
      type: object
      properties:
        Id:
          format: int32
          description: Unique numeric identifier of the refrigerant use reason code.
          type: integer
        Order:
          format: int32
          description: Order of appearance of a reason code.
          type: integer
        Purpose:
          format: int32
          description: "Unique numeric identifier of the reason code for the refrigerant part use. Possible values: `0` - Leak, `1` - InitialCharge, `2` - SystemExpansion, `3` - Removal, `4` - Other, `5` - RemovedReused, `6` - Retrofit.\n            <br />Each reason code on the subscriber side is associated with a hardcoded purpose value in the database. Since reason codes can vary across subscribers, the purpose helps identify the valid reason code.\n            <br />***Note:*** Purpose value `0` is assigned to the `Leak` and `Repair` reason codes, indicating that a leak record gets calculated for these reason codes."
          type: integer
        Name:
          description: "Reason code name for the refrigerant part use as configured by the subscriber. Possible values:\n             • `Leak`\n             • `Repair`\n             • `Adjustment`\n             • `System Expansion`\n             • `Removal`\n             • `Initial Charge`\n             • `Retrofit`\n             • `Removed Reused`"
          type: string
        SubscriberId:
          format: int32
          description: Unique numeric identifier of the subscriber.
          type: integer
        IsActive:
          description: "Defines whether a user can select a reason code when capturing refrigerant use. Possible response values:\n             • `true`: Reason code is enabled.\n             • `false`: Reason code is disabled."
          default: false
          type: boolean

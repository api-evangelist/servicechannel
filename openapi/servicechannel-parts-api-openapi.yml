  /workorders/inventory/parts/bulkPartUsage:
    post:
      tags:
      - Parts
      summary: Update multiple part uses for a work order and an asset
      description: 'Creates, updates, or deletes multiple part uses for the **work order + asset** pair.

        • Supports both refrigerant and non-refrigerant parts.

        • Supports inventory and vendor-supplied parts.


        **Example request for removing part use records:**


        {

        "DeleteItems": [

        {

        "PartId": 58069830,

        "DeletionReason": "Incorrect Quantity",

        "InventoryPartId": 80467,

        "IsInventoryPart": true

        },

        {

        "PartId": 58069831,

        "DeletionReason": "Wrong Part",

        "IsInventoryPart": false

        }

        ]

        }'
      operationId: POSTv3_workorders_inventory_parts_bulkPartUsage
      responses:
        '200':
          description: Part use records have been successfully modified.
        '400':
          description: "The request was not accepted due to bad syntax, missing parameters, insufficient data, etc.\n            <br/>Error codes:\n            3227 &mdash; Inventory part cannot be changed\n            5027 &mdash; Refrigerant tracking is not available for the location\n            503 &mdash; Refrigerant type entered is not defined. Part usage was blocked\n            3205 &mdash; Entered inventory parts don’t correspond to the asset refrigerant\n            3235 &mdash; Failed to process the inventory request\n            3219 &mdash; MOE number is required; part usage cannot be processed\n            3222 &mdash; Inventory part IDs and location IDs or GUIDs should not be null\n            3309 &mdash; There are uncompleted leak records in another WO\n            3306 &mdash; Refrigerant Tracking Connector is turned on. Only the external client's assets can be processed \n            3307 &mdash; Refrigerant Tracking Connector is not supported. Only the client's assets can be processed \n            3304 &mdash; Inventory usage is not allowed on refrigerant tracking for Connected Subscribers and Subcontractors \n            3237 &mdash; Another WO part use request is in processing now. Please try later \n            3236 &mdash; Duplicated parts detected \n            3327 &mdash; The same part is passed for update and removal in the same request \n            3207 &mdash; Parts with specified part IDs were not found \n            503 &mdash; Refrigerant usage cannot be processed. There are no refrigerant settings \n            503 &mdash; Only one asset can be processed in the request \n            3213 &mdash; Asset is not assigned to the work order \n            3305 &mdash; External WO currently doesn’t exist. Refrigerant usage is blocked \n            3212 &mdash; Add part usage: Either remove the Reason Code and the IsRefrigerant flag or specify an asset \n            3212 &mdash; Asset is not using refrigerant. Reason Code and IsRefrigerant values are not allowed \n            3213 &mdash; Either the asset is deactivated or you don’t have access to it \n            503 &mdash; Asset is not connected to any rack \n            809 &mdash; Work order is in the completed status. Only RT Admins can process \n            3230 &mdash; Incorrect refrigerant type entered \n            4003 &mdash; Asset uses refrigerant. RT setting is required \n            503 &mdash; There are no any charge records with the date earlier than the use date \n            3303 &mdash; A closed leak record exists for this work order. Only one leak record can exist per work order. Please enter additional part usage on a new work order \n            3232 &mdash; Leak record part usages cannot be attached to the Retro/Retire plan leak record \n            503 &mdash; Asset doesn’t contain charge prior to the given date \n            503 &mdash; Work order refrigerant leak part usages should belong to the same asset charge \n            3218 &mdash; Use date cannot be after the completed/scheduled date and earlier than the call date \n            3315 &mdash; Used reason code Retrofit cannot be selected for non-retrofit work orders \n            503 &mdash; Description field length cannot be more than 250 symbols \n            503 &mdash; Part number field length cannot be more than 50 symbols \n            3208 &mdash; Request should contain only one work order ID. Work order IDs found: \n            3206 &mdash; Incorrect work order \n            3201 &mdash; Incorrect reason code for the subscriber was entered \n            3209 &mdash; Invalid IsRefrigerant and Reason Code combination \n            3210 &mdash; IsRefrigerant flag cannot be changed \n            3211 &mdash; Reason code change is not allowed \n            3224 &mdash; Add part usages are not allowed after the Retrofit/Retire creation \n            3223 &mdash; Part removal is not allowed on the Retrofit/Retire WO \n            3319 &mdash; Zero charge value. Leak event calculation cannot be executed \n            3226 &mdash; Initial charge or system expansion are not allowed on “Connected to the rack” assets \n            3201 &mdash; System expansion and the leak repair cannot be processed in one WO \n            3215 &mdash; Asset doesn’t contain charge \n            3217 &mdash; Leak record is currently in processing on another work order \n            3229 &mdash; Duplicated request detected. Please wait a minute and try again \n            3227 &mdash; Inventory part cannot be changed \n            3228 &mdash; Inventory location cannot be changed \n            3231 &mdash; Part usage date is not allowed in the Retire/Retrofit date interval  \n            503 &mdash; Broken date order in part usages for the system expansion"
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        '500':
          description: Something went wrong, and the server was unable to complete your request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
      deprecated: false
      x-access: Any
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceChannel.Services.Messaging.RefrigerantTracking.WorkOrderPartRefrigerantBulkChangeRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ServiceChannel.Services.Messaging.RefrigerantTracking.WorkOrderPartRefrigerantBulkChangeRequest'
        description: Request model to modify part use records in bulk.
        required: true

    ServiceChannel.Services.Messaging.RefrigerantTracking.AddWorkOrderPartRefrigerantItem:
      description: Object for adding part use records in bulk
      type: object
      properties:
        AssetId:
          format: int32
          description: Unique numeric identifier of the asset to which the new part use records should be added. Only one asset can be processed in the request. For a non-refrigerant part use, the `AssetId` is not required.
          type: integer
        RecId:
          format: int32
          description: Unique numeric identifier of the work order associated with the `AssetId`. Only one work order can be processed in the request.
          type: integer
        Quantity:
          format: double
          description: Quantity of parts used.
          type: number
        UnitCost:
          format: double
          description: Cost of each part.
          type: number
        IsRefrigerant:
          description: 'Specifies whether the part you are trying to add is classified as a refrigerant. Possible input values: `true` and `false`.'
          default: false
          type: boolean
        IsInventoryPart:
          description: "Specifies whether the part you are trying to add is listed in the inventory catalog for the location or the part is supplied by the vendor. Possible input values:\n             • `true`: Indicates an inventory part\n             • `false`: Indicates a vendor-supplied part"
          default: false
          type: boolean
        UseDate:
          format: date-time
          description: Date and time when the part was used. The format is `YYYY-MM-DDThh:mm:ss.sssZ`.
          type: string
        UseDateStr:
          description: Date and time when the part was used. The format is `YYYY-MM-DDThh:mm:ss.sssZ`.
          type: string
        ReasonCode:
          format: int32
          description: "Reason code name for the refrigerant part use — as configured by the subscriber. Possible values:\n             • `Leak`\n             • `Repair`\n             • `Adjustment`\n             • `System Expansion`\n             • `Removal`\n             • `Initial Charge`\n             • `Retrofit`\n             • `Removed Reused` \n            <br />To get the list of reason codes for the subscriber, use the [GET/refrigeranttracking/{subscriberId}/GetRefrigerantUseReasonCodes](https://developer.servicechannel.com/swagger/index.html#/RefrigerantTracking/GETv3_refrigeranttracking_%7BsubscriberId%7D_GetRefrigerantUseReasonCodes) method."
          type: integer
        ReasonCodeId:
          format: int32
          description: Unique numeric identifier of the refrigerant use reason code. To get the list of reason code IDs for the subscriber, use the [GET/refrigeranttracking/{subscriberId}/GetRefrigerantUseReasonCodes](https://developer.servicechannel.com/swagger/index.html#/RefrigerantTracking/GETv3_refrigeranttracking_%7BsubscriberId%7D_GetRefrigerantUseReasonCodes) method.
          type: integer
        PartNumber:
          description: Part number. Shouldn’t exceed 50 characters.
          type: string
        PartName:
          description: Part name. Shouldn’t exceed 100 characters.
          type: string
        PartGroup:
          description: Part group. Required only if the `IsRefrigerant` is set to `true`.
          type: string
        PartGroupId:
          format: int32
          description: Unique numeric identifier of the part group. Required only if the `IsRefrigerant` is set to `true`.
          type: integer
        SupplierName:
          description: Name of a company that supplies the part.
          type: string
        Description:
          description: Part description. Any additional information on the part. Shouldn’t exceed 250 characters.
          type: string
        RefrigerantChargeOptionsId:
          format: int32
          description: "Unique numeric identifier of the charge method used. Possible values:\n             • `1`: Calculation\n             • `2`: Established\n             • `3`: Manufacturer Tag\n             • `4`: Measurement\n             • `5`: MFG Info (Established Range)\n             • `6`: Onsite Documentation\n             • `7`: Approximate\n            <br />To get charge options and their IDs, use the [GET/refrigeranttracking/ChargeDescriptions](https://developer.servicechannel.com/swagger/index.html#/RefrigerantTracking/GETv3_refrigeranttracking_ChargeDescriptions) method."
          type: integer
        RefrigerantChargeVendor:
          description: Provider who identified the initial charge of the system. Only applicable when the `ReasonCode` is set to `Initial Charge`.
          type: string
        InventoryLocationId:
          format: int32
          description: Unique numeric identifier of the inventory location where the inventory part is stored.
          type: integer
        InventoryLocationGuid:
          description: GUID of the inventory location.
          type: string
        InventoryPartId:
          format: int32
          description: Unique numeric identifier of the inventory part. To get the inventory part ID, use the [GET/Setup/parts](https://inventoryapi.servicechannel.com/swagger/index.html) method.
          type: integer
        RefrigerantUseReason:
          $ref: '#/components/schemas/ServiceChannel.Services.Messaging.RefrigerantTracking.RefrigerantUseReasonCode'
        RefrigerantRemovalStatus:
          description: "Status that describes what was done with the removed refrigerant in the event of the retrofit plan:\n             • `Destroyed`\n             • `Reused`\n             • `Reclaimed`\n             • `Banked`\n             • `ChargeLost`\n             • `Sold`\n            <br />***Note:*** Applicable for the retrofit plan.\n            <br />Not recommended for use in this request."
          enum:
          - Destroyed
          - Reused
          - Reclaimed
          - Banked
          - ChargeLost
          - Sold
          type: string
        RefrigerantTypeId:
          format: int32
          description: Unique numeric identifier of the refrigerant type. To get the list of refrigerant types and their IDs, run the [GET/refrigeranttracking/RefrigerantTypes](https://developer.servicechannel.com/swagger/index.html#/RefrigerantTracking/GETv3_refrigeranttracking_RefrigerantTypes%3FsubscriberId%3D%7BsubscriberId%7D) method.
          type: integer
        RefrigerantTypeName:
          description: Refrigerant type name.
          type: string
        SubmitMoeQtyExceeded:
          description: For Canadian locations. When the part use meets or exceeds the threshold, set the parameter’s value to `true` to be able to proceed with the request.
          default: false
          type: boolean
        MoeNumber:
          description: "Agency number that will be assigned to the work order and the leak record. The number can be up to 20 characters. An agency number needs to be entered when the system threshold has been met or exceeded. For Canadian locations only.\n            <br />Available with the *SCP_RTCanadaRefrigeration* feature flag."
          type: string
        IsRetrofit:
          format: byte
          description: "Specifies whether the part use is associated with a retrofit plan. Possible values:\n             • `true`: The part is linked to a retrofit plan. The `RefrigerantRemovalStatus` should be specified.\n             • `false`: The part isn’t associated with a retrofit plan.\n            <br />Not recommended for use in this request."
          type: string
    ServiceChannel.Services.Messaging.RefrigerantTracking.DeleteWorkOrderPartRefrigerantItem:
      description: Object for deleting part use records in bulk
      type: object
      properties:
        PartId:
          format: int32
          description: Unique numeric identifier of the part use record that should be removed. Use the [GET/workorders/{workorderId}/partsUsage](https://developer.servicechannel.com/swagger/index.html#/Parts/GETv3_workorders_%7BworkorderId%7D_partsUsage) method to identify the required part use record ID.
          type: integer
        InventoryLocationGuid:
          description: GUID of the inventory location.
          type: string
        DeletionReason:
          format: byte
          description: "Reason for removing the refrigerant part use record. Possible values:\n             • `Wrong Part`\n             • `Wrong Asset`\n             • `Incorrect Quantity`\n             • `Other`"
          type: string
        DeletionReasonDescription:
          description: When the `DeletionReason` is set to `Other`, the `DeletionReasonDescription` parameter provides additional information on why the part use record is being removed. Shouldn’t exceed 150 characters.
          type: string
        InventoryPartId:
          format: int32
          description: Unique numeric identifier of the inventory part. To get the inventory part ID, use the [GET/Setup/parts](https://inventoryapi.servicechannel.com/swagger/index.html) method.
          type: integer
        IsInventoryPart:
          description: "Specifies whether the part you are trying to remove is listed in the inventory catalog for the location or the part is supplied by the vendor. Possible input values:\n             • `true`: Indicates an inventory part\n             • `false`: Indicates a vendor-supplied part"
          default: false
          type: boolean
    ServiceChannel.Services.Messaging.Workorders.CreateWorkOrderPartsCollectionRequest:
      type: object
      properties:
        Parts:
          type: array
          items:
            $ref: '#/components/schemas/ServiceChannel.Services.Messaging.Workorders.CreateWorkOrderPartRequest'

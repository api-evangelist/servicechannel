      IsLocalTime:
        description: "Specifies whether the `UseDate` should be converted based on the work order location time zone. Possible values:\r\n             • `true`: `UseDate` will not be converted to the location time zone.\r\n             • `false`: `UseDate` is provided in UTC (global standard time zone) and automatically converted to the local time zone."
        default: false
        type: boolean
      SubmitQuantityExceeded:
        description: When the part use meets or exceeds the threshold, set the parameter’s value to `true` to be able to proceed with the request.
        default: false

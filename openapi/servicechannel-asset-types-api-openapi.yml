      tags:
      - Asset Types
      summary: Get asset categories by SubscriberId and TradeNames
      description: 'Returns an asset category containing asset types that belong to the specified trade for the specified subscriber.


        ***Note***: `TradeNames` is an optional parameter. When you skip it, the response shows all asset categories containing asset types.'
      operationId: POSTv3_AssetTypes_GetSubscriberAssetTypeCategories
      responses:
        '200':
          description: Asset categories are in the response.
          content:

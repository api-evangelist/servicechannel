      summary: Get asset categories by Ids
      description: 'Returns asset categories names based on their numeric identifiers.


        ***Note***: To get all asset categories, send the request without specifying any Id. Asset categories from the list may contain asset types or may be empty, as this method retrieves asset categories from the standardized list.'

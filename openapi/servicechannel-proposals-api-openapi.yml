  /odata/proposals({proposalId})/Service.Categories():
    get:
      tags:
      - Proposals
      summary: Retrieve proposal categories
      description: "Returns proposal categories for the specified proposal ID.\r\n            <br />***Note:*** A proposal category represents a specific section in the proposal form. It can contain proposal costs information, for example, materials, installation labor, freight, etc.; or it can hold a question with answers configured for the proposal form.\r\n            <br />Supports filtering and sorting in the response.\r\n             • **$expand:** Not supported for this method.\r\n             • **$select:** Not supported for this method.\r\n             • **$filter:** Filter a collection of resources addressed by a request URL. For example, you can filter the proposal data to return only material costs **Name eq 'Materials'**. \r\n             • **$orderby:** Order proposal categories by the specified property in the response. For example, you can order by name in ascending order **Name asc** or in descending order **Name desc**.\r\n             • **$top:** Return the specified number of proposal categories in the response.\r\n             • **$skip:** Skip the specified number of proposal categories in the response.\r\n             • **$count:** Include the count of the proposal categories in the response."
      operationId: Proposals_GetProposalCategories
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: proposalId
        in: path
        description: Unique numeric identifier of the proposal.
        required: true
        type: integer
        format: int32
      - name: $expand
        in: query
        description: Expand a navigation property.
        required: false
        type: string
      - name: $select
        in: query
        description: Select a set of properties to return.
        required: false
        type: string
      - name: $filter
        in: query
        description: Filter a collection of resources addressed by a request URL.
        required: false
        type: string
      - name: $orderby
        in: query
        description: Order resources by the specified property in the response.
        required: false
        type: string
      - name: $top
        in: query
        description: Return the specified number of items in the response.
        required: false
        type: integer
      - name: $skip
        in: query
        description: Skip the specified number of items in the response.
        required: false
        type: integer
      - name: $count
        in: query
        description: Include the count of the matching resources in the response.
        required: false
        type: boolean
      responses:
        '200':
          description: Proposal categories are in the response.
          schema:
            type: array
            items:
              $ref: '#/definitions/ServiceChannel.Services.Messaging.Proposals.ProposalCategory'
        '400':
          description: "The request was not accepted due to bad syntax, missing parameters, insufficient data, etc.\r\n            <br/>Error codes:\r\n            502 &mdash; Cannot find proposal data"
          schema:
            $ref: '#/definitions/ServiceChannel.Services.Messaging.ErrorResponse'
        '401':
          description: The requested resource requires authentication.
          schema:
            $ref: '#/definitions/ServiceChannel.Services.Messaging.ErrorResponse'
        '404':
          description: The resource you are looking for has been removed, had its name changed, or is temporarily unavailable.
          schema:
            $ref: '#/definitions/ServiceChannel.Services.Messaging.ErrorResponse'
        '500':
          description: "Something went wrong, and the server was unable to complete your request.\r\n            <br/>Error codes:\r\n            501 &mdash; The type 'ServiceChannel.Services.Messaging.Proposals.ProposalCategory' is not an entity type. Only entity types support $select and $expand.\\r\\nParameter name: context"
          schema:
            $ref: '#/definitions/ServiceChannel.Services.Messaging.ErrorResponse'
      deprecated: false
      x-access: Any
definitions:
  ServiceChannel.Services.Messaging.Proposals.UpdateProposalStatusRequest:
    description: The request object to update a proposal status.
    type: object
    properties:
      Comment:
        description: Comment on the proposal status update. The comment is added to the work order note.
        type: string
      ProviderEmail:
        description: Provider’s email address to which a notification about the proposal status change is sent. The default is the email address of the provider the proposal is assigned to.
        type: string
      UserEmail:
        description: User’s email address to which a notification about the proposal status change is sent. The default is the email address of the current user.
        type: string
      RejectReasonCodeId:
        format: int32
        description: "Numeric identifier of the reason for rejecting the proposal.\r\n            Pass value to this parameter when sending the *PUT /proposals/{proposalId}/reject* request. To retrieve a list of rejection reason codes and their descriptions, use the *GET /proposals/RejectionReasons* method."
        type: integer
      ActionSource:
        enum:
        - Standard
        - DecisionEngine
        type: string
      ReasonString:
        description: "Reason for approving the proposal.\r\n            Pass value to this parameter when sending the *PUT /proposals/{proposalId}/approve* request. The entered reason is added to the work order note."
        type: string
      Actor:
        description: The Actor is added to the work order note.
        type: string
      AttachmentstoWO:
        description: Move Approved Proposal attachments to WO.
        default: false
        type: boolean
      PinNote:
        description: Pin Work Order Note.
        default: false
        type: boolean
  ServiceChannel.Services.Messaging.Assets.Warranty:
    description: Object containing warranty parameters.
    type: object
    properties:
      ExpirationDate:
        format: date-time
        description: Warranty expiration date based on the warranty expiration settings.
        type: string
      ProviderId:
        format: int32
        description: ID of a provider who is in charge of warranty services.
        type: integer
      NTE:
        format: double
        description: Maximum amount of money to be spent on warranty services in USD. Value -1  means that the amount is not applicable.
        type: number
      Priority:
        description: Defines how quickly warranty services should be provided, for example, *Emergency-4 Hours*, *Normal-48 Hours*, *7 Days*.
        type: string
      PriorityId:
        format: int32
        type: integer
      Category:
        description: Warranty category, for example, *ADVISE ONLY*, *REPAIR*, *DISASTER*.
        type: string
      CategoryId:
        format: int32
        type: integer
      Provider:
        $ref: '#/definitions/ServiceChannel.Services.Messaging.Assets.WarrantyProvider'
        description: Rules to choose Warranty Provider
      Expiration:
        $ref: '#/definitions/ServiceChannel.Services.Messaging.Assets.WarrantyExpiration'
        description: Rules for Warranty Expiration
  ServiceChannel.Services.Messaging.Proposals.ProposalStatisticsResponse:
    description: Object of statistics on RFPs and proposals.
    type: object
    properties:
      DaysPeriod:
        format: int32
        description: Time period set as the number of days prior to the current date for which statistics on RFPs and proposals are returned.
        type: integer
      RFPsWaitingForApproval:
        format: int32
        description: The total number of RFPs awaiting response for the specified time period.
        type: integer
      OpenProposals:
        format: int32
        description: The total number of proposals in the _Open_ status for the specified time period.
        type: integer
      ApprovedProposalsDaysPeriod:
        format: int32
        description: Time period set as the number of days prior to the current date for which statistics on approved proposals are returned in `ApprovedProposals`.
        type: integer
      ApprovedProposals:
        format: int32
        description: The total number of proposals in the _Approved_ status for the specified time period.
        type: integer
      WaitingReviewProposals:
        format: int32
        description: The total number of proposals in the _On Hold_ and _Reviewed_ statuses for the specified time period.
        type: integer
      RejectedProposals:
        format: int32
        description: The total number of proposals in the _Rejected_ status for the specified time period.
        type: integer
  ServiceChannel.Services.Messaging.Proposals.ProposalAssociatedWithWorkOder:
    description: Object containing associated proposal details.
    type: object
    properties:
      ID:
        format: int32
        description: Unique numeric identifier of the proposal associated with the specified work order.
        type: integer
      ProposalNumber:
        description: Proposal number — as specified by the user who created the proposal.
        type: string
      CreatedDateDto:
        format: date-time
        description: Date and time when the proposal was created. The format is `YYYY-MM-DDThh:mm:ss.sssssss[±hh:mm]`, where `[±hh:mm]` represents the time zone offset from UTC.
        type: string
      Status:
        description: Proposal status, for example, *Approved*, *Open*, *Reviewed*, etc.
        type: string
      WorkOrder:
        format: int32
        description: Work order tracking number.
        type: integer
  ServiceChannel.Services.Messaging.Users.AccessOptions:
    description: Object listing locations, districts, regions, and trades a subscriber user has access to. Learn more about [granting access based on locations, districts, and regions](https://servicechannel.atlassian.net/wiki/spaces/SCU/pages/585107276/Location+District+Region+Access+Tab) in ServiceChannel University.
    type: object
    properties:
      Locations:
        description: Locations a user has access to.
        type: array
        items:
          type: string

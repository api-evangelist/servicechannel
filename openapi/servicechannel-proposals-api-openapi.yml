  /proposals/CheckProposalCreation:
    get:
      tags:
      - Proposals
      summary: Check the possibility of creating a proposal
      description: "Retrieves the result on the availability of creating a proposal via API based on user’s permissions and a combination of the input values: `subscriberId` + `providerId` + `locationId ` + `tradeId` + `currency`. When the combination of the input values does not allow creating a proposal using API, the method returns the following response: “Proposal form is not supported via API. Please use the UI instead.” \r\n            <br /> Having received the successful response, copy the response model from this method to use it as a request model in the [POST proposals/Create proposal](https://developer.servicechannel.com/swagger/index.html#/Proposals/POSTv3_proposals_CreateProposal) method. \r\n            <br /> ***Note***: Custom proposal forms are not supported."
      operationId: GETv3_proposals_CheckProposalCreation?SubscriberId={SubscriberId}&ProviderId={ProviderId}&LocationId={LocationId}&TradeId={TradeId}&Currency={Currency}
      consumes: []
      produces:
      - application/json
      - text/json
      parameters:
      - name: subscriberId
        in: query
        required: false
        type: integer
        format: int32
      - name: providerId
        in: query
        required: false
        type: integer
        format: int32
      - name: locationId
        in: query
        required: false
        type: integer
        format: int32
      - name: tradeId
        in: query
        required: false
        type: integer
        format: int32
      - name: currency
        in: query
        required: false
        type: string
      responses:
        '200':
          description: The creation of a proposal is available. The proposal template is in the response.
          schema:
            type: string
        '400':
          description: "The request is not accepted due to bad syntax, missing parameters, insufficient data, etc.\r\n            <br/>Error codes:\r\n            503 &mdash; ProviderId is not specified or incorrect\r\n            503 &mdash; SubscriberId is not specified or incorrect \r\n            503 &mdash; LocationId is not specified or incorrect \r\n            503 &mdash; TradeId is not specified or incorrect\r\n            503 &mdash; User ID does not match the logged-in user's credentials  \r\n            503 &mdash; Currency is not specified or incorrect \r\n            503 &mdash; Currencies are represented by 3 letters\r\n            503 &mdash; Proposal form is not supported via API. Please use the UI instead"
          schema:
            $ref: '#/definitions/ServiceChannel.Services.Messaging.ErrorResponse'
        '401':
          description: "The requested resource requires authentication.\r\n            <br/>Error codes:\r\n            504 &mdash; API call rejected by security permissions"
          schema:
            $ref: '#/definitions/ServiceChannel.Services.Messaging.ErrorResponse'
      deprecated: false
      x-access: Any
  /proposals/CreateProposal:
    post:
      tags:
      - Proposals
      summary: Create a proposal
      description: "Creates a proposal and returns its ID in the response. Once a proposal is created via API, an email is sent to the addressees listed in the `notificationEmails` parameter and a proposal appears in the ServiceChannel system. Use the response model of the [GET /proposals/CheckProposalCreation](https://developer.servicechannel.com/swagger/index.html#/Proposals/GETv3_proposals_CheckProposalCreation%3FSubscriberId%3D%7BSubscriberId%7D%26ProviderId%3D%7BProviderId%7D%26LocationId%3D%7BLocationId%7D%26TradeId%3D%7BTradeId%7D%26Currency%3D%7BCurrency%7D) method as a request model.\r\n            <br />***Note***: To run the method, subscriber users should possess one or a combination of the following permissions and roles: *Proposals: Create* permission, * Proposals:Full Control* permission, *Power User* role, *Power User Light* role. When provider users are eligible to create proposals via UI, they can also create proposals via API.\r\n            Find out more about [creating a proposal](https://servicechannel.atlassian.net/wiki/spaces/SCUCP/pages/619217044/Creating+a+Proposal) in ServiceChannel University. \r\n            <br /> ***Note***: Custom proposal forms are not supported. \r\n            <br />**Example Request** \r\n            \r\n            POST /proposals/CreateProposal \r\n            \r\n            {\r\n                \"version\": \"1.0.0\", \r\n                \"subscriberId\": 2014917243, \r\n                \"providerId\": 2000090505, \r\n                \"locationId\": 2016322567, \r\n                \"tradeId\": 90480, \r\n                \"currency\": \"USD\", \r\n                \"proposalNumber\": \"pr57820456142079\", \r\n                \"description\": \"Motor Replacement\", \r\n                \"notificationEmails\": \"\", \r\n                \r\n                \"costsIncurredToDate\": [], \r\n                \r\n                \"materials\": [\r\n                {\"description\": \"Motor Assembly Unit\", \"unit\": \"each\", \"qty\": 1, \"price\": 1450.00}, \r\n                {\"description\": \"Electrical Components Kit\", \"unit\": \"each\", \"qty\": 1, \"price\": 180.50}, \r\n                { \"description\": \"Fan Blade Component\", \"unit\": \"each\", \"qty\": 1, \"price\": 320.75}, \r\n                { \"description\": \"Capacitor Unit\", \"unit\": \"each\", \"qty\": 1, \"price\": 95.25} \r\n                ],\r\n                \r\n                \"materialsAnswer\": \"New\", \r\n                \r\n                \"installationLabor\": [\r\n                {\"description\": \"Regular Service Hours\", \"tech\": 1, \"hours\": 10, \"rate\": 95.00}, \r\n                { \"description\": \"Overtime Service Hours\", \"tech\": 0, \"hours\": 0, \"rate\": 0}, \r\n                { \"description\": \"Holiday Service Hours\", \"tech\": 0, \"hours\": 0, \"rate\": 0}, \r\n                { \"description\": \"Helper Standard Hours\", \"tech\": 0, \"hours\": 0, \"rate\": 0}, \r\n                { \"description\": \"Helper Overtime Hours\", \"tech\": 0, \"hours\": 0, \"rate\": 0}, \r\n                { \"description\": \"Helper Holiday Hours\", \"tech\": 0, \"hours\": 0, \"rate\": 0}, \r\n                { \"description\": \"External Labor Support\", \"tech\": 0, \"hours\": 0, \"rate\": 0} \r\n                ], \r\n                \r\n                \"installationLaborFlatFeeLabor\": 0, \r\n                \r\n                \"nonInstallationExpenses\": {\r\n                    \"travel\": { \"ofTrips\": 2, \"charge\": 85.00}, \r\n                    \"fees\": 0, \r\n                    \"nonInstallationLabor\": 0\r\n                    }, \r\n                    \r\n                \"nonInstallationExpensesOther\": [], \r\n                \r\n                \"freight\": 140.00, \r\n                \"freightOther\": [], \r\n                \r\n                \"tax\": {\r\n                    \"materialSalesTax\": 0, \r\n                    \"installationLaborSalesTax\": 0, \r\n                    \"nonInstallationExpensesSalesTax\": 0, \r\n                    \"freightTax\": 0\r\n                    }        \r\n            }"
      operationId: POSTv3_proposals_CreateProposal
      consumes:
      - application/json
      - text/json
      produces:
      - application/json
      - text/json
      parameters:
      - name: proposalJson
        in: body
        description: "Proposal model in the form of JSON. Model shall include all blocks validated by 1.0.0 version. If you do not want to use any of the blocks provided in the model, leave it with the default values as it is but do not remove it from the JSON model.\r\n            <br /> ***Note*** The maximum length of the `proposal number` is 30 symbols. When left empty, the number will be generated automatically during the proposal creation."
        required: true
        schema:
          $ref: '#/definitions/System.Object'
      responses:
        '200':
          description: A proposal is successfully created.
          schema:
            type: string
        '400':
          description: "The request is not accepted due to bad syntax, missing parameters, insufficient data, etc.\r\n            <br/>Error codes:\r\n            503 &mdash; JSON is invalid or corrupted\r\n            503 &mdash; Version is required\r\n            503 &mdash; Template version is incorrect \r\n            503 &mdash; Proposal form is not supported via API. Please use the UI instead \r\n            503 &mdash; SubscriberId is required\r\n            503 &mdash; ProviderId is required \r\n            503 &mdash; LocationId is required \r\n            503 &mdash; Proposal number length exceeds 30 symbols \r\n            503 &mdash; This proposal number already exists \r\n            503 &mdash; Project Description is required \r\n            503 &mdash; Project Description length exceeds 4000 symbols \r\n            503 &mdash; NotificationEmails is required \r\n            503 &mdash; Incorrect email(s) \r\n            503 &mdash; The limit for email addresses in a field is 50 \r\n            503 &mdash; No proposal amount has been deposited \r\n            503 &mdash; Materials is required  \r\n            503 &mdash; MaterialsAnswer is required  \r\n            503 &mdash; MaterialsAnswer is not specified or incorrect \r\n            503 &mdash; Unit is not specified or incorrect \r\n            503 &mdash; CostsIncurredToDate is required \r\n            503 &mdash; CostsIncurredToDate has empty descriptions \r\n            503 &mdash; CostsIncurredToDate cannot be negative \r\n            503 &mdash; Total type is incorrect in CostsIncurredToDate \r\n            503 &mdash; InstallationLabor is required \r\n            503 &mdash; Invalid description in installationLabor \r\n            503 &mdash; NonInstallationExpensesOther has empty descriptions \r\n            503 &mdash; Total is required in NonInstallationExpensesOther \r\n            503 &mdash; OfTrips type is incorrect in Travel \r\n            503 &mdash; Currency type is incorrect \r\n            503 &mdash; Freight is required \r\n            503 &mdash; Freight decimal part exceeds two digits  \r\n            503 &mdash; FreightOther is required \r\n            503 &mdash; Total is required in FreightOther \r\n            503 &mdash; FreightOther cannot be negative \r\n            503 &mdash; MaterialSalesTax cannot be negative \r\n            503 &mdash; InstallationLaborSalesTax cannot be negative \r\n            804 &mdash; User has no permissions to perform this action"
          schema:
            $ref: '#/definitions/ServiceChannel.Services.Messaging.ErrorResponse'
        '401':
          description: "The requested resource requires authentication.\r\n            <br/>Error codes:\r\n            504 &mdash; API call rejected by security permissions"
          schema:
            $ref: '#/definitions/ServiceChannel.Services.Messaging.ErrorResponse'
        '403':
          description: "You are not authorized to request this resource, or the resource is unavailable for some reason.\r\n            <br/>Error codes:\r\n            804 &mdash; The functionality is not enabled"
          schema:
            $ref: '#/definitions/ServiceChannel.Services.Messaging.ErrorResponse'
      deprecated: false
      x-access: Any

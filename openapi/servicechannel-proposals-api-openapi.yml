  ServiceChannel.Services.Messaging.Proposals.ProposalCategory:
    description: Object featuring proposal categories.
    type: object
    properties:
      IsLocked:
        description: "Controls the visibility of the category section, for example, *Materials*, *Installation Labor*, in the proposal form. Possible values: \r\n             • `true`: The section (category) is hidden from the user interface.\r\n             • `false`: The section (category) is visible in the user interface."
        default: false
        type: boolean
      DefaultHideDetails:
        description: "Determines whether the category displays a standard template or extended rows. Possible values:\r\n             • `true`: Shows the default template without additional rows.\r\n             • `false`: Displays extended rows based on the template configuration."
        default: false
        type: boolean
      Description:
        description: No longer in use.
        type: string
      IsActive:
        description: Shows whether the category is active.
        default: false
        type: boolean
      SortOrder:
        format: int32
        description: Predefined order of appearance for a category.
        type: integer
      Columns:
        type: array
        items:
          $ref: '#/definitions/ServiceChannel.Services.Messaging.Proposals.ProposalCategoryColumn'
      Rows:
        type: array
        items:

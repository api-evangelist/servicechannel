  /proposals/CreateProposal:
    post:
      tags:
      - Proposals
      summary: Create a proposal
      description: 'Creates a proposal and returns its ID in the response. Once a proposal is created via API, an email is sent to the addressees listed in the `notificationEmails` parameter and a proposal appears in the ServiceChannel system. Use the response model of the GET /proposals/CheckProposalCreation method as a request model.


        ***Note***: To run the method, subscriber users should possess one or a combination of the following permissions and roles: *Proposals: Create* permission, * Proposals:Full Control* permission, *Power User* role, *Power User Light* role. When provider users are eligible to create proposals via UI, they can also create proposals via API.

        Find out more about creating a proposal in ServiceChannel University.


        ***Note***: Custom proposal forms are not supported.


        **Example Request**


        POST /proposals/CreateProposal


        {

        "version": "1.0.0",

        "subscriberId": 2014917243,

        "providerId": 2000090505,

        "locationId": 2016322567,

        "tradeId": 90480,

        "currency": "USD",

        "proposalNumber": "pr57820456142079",

        "description": "Motor Replacement",

        "notificationEmails": "",


        "costsIncurredToDate": [],


        "materials": [

        {"description": "Motor Assembly Unit", "unit": "each", "qty": 1, "price": 1450.00},

        {"description": "Electrical Components Kit", "unit": "each", "qty": 1, "price": 180.50},

        { "description": "Fan Blade Component", "unit": "each", "qty": 1, "price": 320.75},

        { "description": "Capacitor Unit", "unit": "each", "qty": 1, "price": 95.25}

        ],


        "materialsAnswer": "New",


        "installationLabor": [

        {"description": "Regular Service Hours", "tech": 1, "hours": 10, "rate": 95.00},

        { "description": "Overtime Service Hours", "tech": 0, "hours": 0, "rate": 0},

        { "description": "Holiday Service Hours", "tech": 0, "hours": 0, "rate": 0},

        { "description": "Helper Standard Hours", "tech": 0, "hours": 0, "rate": 0},

        { "description": "Helper Overtime Hours", "tech": 0, "hours": 0, "rate": 0},

        { "description": "Helper Holiday Hours", "tech": 0, "hours": 0, "rate": 0},

        { "description": "External Labor Support", "tech": 0, "hours": 0, "rate": 0}

        ],


        "installationLaborFlatFeeLabor": 0,


        "nonInstallationExpenses": {

        "travel": { "ofTrips": 2, "charge": 85.00},

        "fees": 0,

        "nonInstallationLabor": 0

        },


        "nonInstallationExpensesOther": [],


        "freight": 140.00,

        "freightOther": [],


        "tax": {

        "materialSalesTax": 0,

        "installationLaborSalesTax": 0,

        "nonInstallationExpensesSalesTax": 0,

        "freightTax": 0

        }

        }'
      operationId: POSTv3_proposals_CreateProposal
      responses:
        '200':
          description: A proposal is successfully created.
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        '400':
          description: "The request is not accepted due to bad syntax, missing parameters, insufficient data, etc.\n            <br/>Error codes:\n            503 &mdash; JSON is invalid or corrupted\n            503 &mdash; Version is required\n            503 &mdash; Template version is incorrect \n            503 &mdash; Proposal form is not supported via API. Please use the UI instead \n            503 &mdash; SubscriberId is required\n            503 &mdash; ProviderId is required \n            503 &mdash; LocationId is required \n            503 &mdash; Proposal number length exceeds 30 symbols \n            503 &mdash; This proposal number already exists \n            503 &mdash; Project Description is required \n            503 &mdash; Project Description length exceeds 4000 symbols \n            503 &mdash; NotificationEmails is required \n            503 &mdash; Incorrect email(s) \n            503 &mdash; The limit for email addresses in a field is 50 \n            503 &mdash; No proposal amount has been deposited \n            503 &mdash; Materials is required  \n            503 &mdash; MaterialsAnswer is required  \n            503 &mdash; MaterialsAnswer is not specified or incorrect \n            503 &mdash; Unit is not specified or incorrect \n            503 &mdash; CostsIncurredToDate is required \n            503 &mdash; CostsIncurredToDate has empty descriptions \n            503 &mdash; CostsIncurredToDate cannot be negative \n            503 &mdash; Total type is incorrect in CostsIncurredToDate \n            503 &mdash; InstallationLabor is required \n            503 &mdash; Invalid description in installationLabor \n            503 &mdash; NonInstallationExpensesOther has empty descriptions \n            503 &mdash; Total is required in NonInstallationExpensesOther \n            503 &mdash; OfTrips type is incorrect in Travel \n            503 &mdash; Currency type is incorrect \n            503 &mdash; Freight is required \n            503 &mdash; Freight decimal part exceeds two digits  \n            503 &mdash; FreightOther is required \n            503 &mdash; Total is required in FreightOther \n            503 &mdash; FreightOther cannot be negative \n            503 &mdash; MaterialSalesTax cannot be negative \n            503 &mdash; InstallationLaborSalesTax cannot be negative \n            804 &mdash; User has no permissions to perform this action"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
        '401':
          description: "The requested resource requires authentication.\n            <br/>Error codes:\n            504 &mdash; API call rejected by security permissions"
          content:

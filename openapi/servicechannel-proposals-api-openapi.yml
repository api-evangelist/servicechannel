    ServiceChannel.Services.Messaging.Assets.AssetResponse:
      description: Object details of an asset.
      type: object
      properties:
        Id:
          format: int32
          description: Unique numeric asset identifier assigned by the system.
          type: integer
        Tag:
          description: Alphanumeric asset identifier assigned by the client.
          type: string
        Manufacturer:
          description: Company name that produces an asset.
          type: string
        ModelNo:
          description: Asset model number.
          type: string
        SerialNo:
          description: Asset serial number.
          type: string
        LocationId:
          format: int32
          description: Unique numeric identifier of a location an asset is assigned to.
          type: integer
        Area:
          description: Place where an asset is physically located.
          type: string
        WorkOrderArea:
          description: Work order area, such as *Dining Room*, *Kitchen*, *Storage*.
          type: string
        StoreId:
          description: Alphanumeric location identifier assigned by the client.
          type: string
        Trade:
          description: Trade of an asset type the asset is assigned to, for example, *HVAC*, *DOORS*, *ELECTRICAL*.
          type: string
        TradeId:
          format: int32
          description: Numeric identifier of the primary trade of an asset.
          type: integer
        Type:
          description: Asset type, for example, *Refrigerator*, *Computer Monitor*, etc.
          type: string
        AssetTypeId:
          format: int32
          description: Unique numeric identifier of an asset type.
          type: integer
        BrandId:
          format: int32
          description: Unique numeric identifier of a manufacturer that produces an asset.
          type: integer
        InstallDate:
          description: Date and time when an asset was installed at the current location.
          type: string
        InstallDateVal:
          format: date-time
          description: Date and time when an asset was installed at the current location.
          type: string
        ManufacturerDate:
          format: date-time
          description: Date and time when an asset was produced.
          type: string
        ManufacturerDateStr:
          description: Date and time when an asset was produced by the manufacturer.
          type: string
        PurchaseDate:
          description: Date and time when an asset was purchased.
          type: string
        UsesRefrigerant:
          format: int32
          description: 'Defines whether an asset uses a refrigerant.  **Possible values**: 0 - no, 1 - yes.'
          type: integer
        Active:
          description: 'Shows whether an asset is still in use. **Possible values**: *true*, *false*.'
          default: false
          type: boolean
        IsLeased:
          description: 'Defines whether an asset is leased. **Possible values**: *true*, *false*.'
          default: false
          type: boolean
        LifeExpectancy:
          format: int32
          description: Estimated useful life of an asset in months.
          type: integer
        OriginalValue:
          format: double
          description: Original asset price.
          type: number
        LeaseDate:
          description: Date and time when a lease was signed.
          type: string
        LeasePeriod:
          format: int32
          description: Period of time in months a contracted lease is in place.
          type: integer
        Condition:
          format: int32
          description: 'Value representation of an asset condition. **Possible values**: `0` - *broken*, `25` - *poor*, `50` - *average*, `75` - *good*, `100` - *excellent*.'
          type: integer
        ConditionString:
          description: 'Current condition of an asset. **Possible values**: *broken*, *poor*, *average*, *good*, *excellent*.'
          type: string
        EnergyEfficiency:
          description: Provides information on energy efficiency of a particular asset. Maximum is 150 characters.
          type: string
        Capacity:
          description: Provides information on the maximum amount of the refrigerant an asset can contain. Maximum is 150 characters.
          type: string
        HasLeakDetector:
          description: 'Defines whether an asset has a leak detector and belongs to the Leak Detector asset type. **Possible values**: *true*, *false*.'
          default: false
          type: boolean
        AssetLeakDetectorConnectionId:
          format: int32
          description: ID of the leak detector that is connected to an asset.
          type: integer
        Location:
          description: Place where an asset is physically located.
          type: string
          readOnly: true
        Warranty:
          $ref: '#/components/schemas/ServiceChannel.Services.Messaging.Assets.Warranty'
          description: Object containing warranty parameters.
        IsReplaceEquipment:
          description: 'Defines if the current asset is a replacement for another on condition that a tracking number is provided. **Possible values**: *true*, *false*.'
          default: false
          type: boolean
        HasTagged:
          description: Defines if an asset contains ‘Asset Tag’.
          default: false
          type: boolean
        LastModifiedUseDate:
          format: date-time
          description: Date and time when an asset was last updated.
          type: string
        LastModifiedUserName:
          description: Name of the user who updated an asset.
          type: string
        SubName:
          description: Subscriber’s name who added an asset.
          type: string
        AssetRefrigerant:
          $ref: '#/components/schemas/ServiceChannel.Services.Messaging.RefrigerantTracking.AssetRefrigerant'
        AssetAttributesMap:
          $ref: '#/components/schemas/ServiceChannel.Services.Messaging.Assets.AssetAttributesMap'
        AssetTag:
          description: Unique alphanumeric decoded value contained in a barcode, QR code, or NFC tag of an asset. It is used to scan assets via [ServiceChannel Mobile](https://servicechannel.atlassian.net/wiki/spaces/SCU/pages/575341308/Asset+Tagging#AssetTagging-AccessingtheAssetScanningModuleinSCMobile) and [ServiceChannel Provider](https://servicechannel.atlassian.net/wiki/spaces/SCU/pages/1181745372/Scanning+and+Validating+Assets+via+SC+Provider+for+FTM+Internal+Techs).
          type: string
        ImportedFrom:
          format: int32
          description: Provides the number of the template an asset was imported from.
          type: integer
        ParentId:
          format: int32
          description: Unique numeric identification of an asset that has a circuit or component.
          type: integer
        Description:
          description: Comment created by a user when adding an asset.
          type: string
        HasComponents:
          description: 'Defines whether an asset has components. **Possible values**: *true*, *false*.'
          default: false
          type: boolean
        HasCircuits:
          description: 'Defines if an asset has an added circuit. **Possible values**: *true*, *false*.'
          default: false
          type: boolean
        IsCircuit:
          description: 'Defines whether an asset is a circuit. **Possible values**: *true*, *false*.'
          default: false
          type: boolean
        SubscriberId:
          format: int32
          description: Unique numeric ID of the subscriber an asset belongs to.
          type: integer
        AssetValidated:
          description: 'Defines whether the asset has been validated by a technician.  **Possible values**: *true*, *false*.'
          default: false
          type: boolean
        ValidationRequired:
          description: Defines whether an asset needs to be validated by a technician upon check-in.
          default: false
          type: boolean
        IsLeakDetector:
          description: Defines whether an asset belongs to the *Leak Detector* asset type.
          default: false
          type: boolean
        AssetStatus:
          format: byte
          description: 'Defines an asset repair status. **Possible values**: `0` - *In Use*, `1` - *Out For Repair*, `2` - *Replacement Recommended*, `3` - *Repaired*.'
          type: string
        AssetUpdatesStatus:
          format: byte
          description: 'Defines the asset update status. **Possible values**: 0 - Attributes updated by provider, 1- New unconfirmed - asset created by provider, 2 - Rejected, 3 - Asset change confirmed.'
          type: string
        AdditionalTradesNames:
          description: Names of the additional trades for an asset type.
          type: string
        AdditionalTradeIds:
          type: array
          items:
            format: int32
            type: integer
        CreatedDate:
          format: date-time
          description: Date and time of the asset creation.
          type: string
        ModifiedDate:
          format: date-time
          description: Date and time of the last asset update.
          type: string
        AssetTypeGroupId:
          format: int32
          description: Unique ID of an asset type group.
          type: integer
        Spend:
          format: double
          description: Total asset cost. Can be calculated if the *IncludeTotalCostOfOwnership* feature flag is enabled.
          type: number
        IsCarbReporting:
          description: 'Defines whether an asset is included in a CARB report. **Possible values**: *true*, *false*.'
          default: false
          type: boolean
        AssetValidationStatus:
          format: int32
          description: ''
          type: integer
        UnableToScanReason:
          description: Asset tag not scanned reason
          type: string
        UnableToScanReasonCustomText:
          description: Asset tag not scanned reason custom text
          type: string
        UnableToScanReasonId:
          format: int32
          description: Asset tag not scanned reason id
          type: integer
        CustomAttributes:
          description: Custom Attributes
          type: array
          items:
            $ref: '#/components/schemas/ServiceChannel.Services.Messaging.Equipments.EquipmentAttributeDescription'
        HasChilds:
          description: ''
          default: false
          type: boolean
        Currency:
          format: int32
          type: integer
        ModifiedDateDto:
          format: date-time
          description: ModifiedDate datetime offset
          type: string
        RetiredDate:
          format: date-time
          description: Date and time of the asset deactivation.
          type: string

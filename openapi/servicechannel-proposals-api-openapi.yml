  /proposals/CheckProposalCreation:
    get:
      tags:
      - Proposals
      summary: Check the possibility of creating a proposal
      description: 'Retrieves the result on the availability of creating a proposal via API based on user’s permissions and a combination of the input values: `subscriberId` + `providerId` + `locationId ` + `tradeId` + `currency`. When the combination of the input values does not allow creating a proposal using API, the method returns the following response: “Proposal form is not supported via API. Please use the UI instead.”


        Having received the successful response, copy the response model from this method to use it as a request model in the POST proposals/Create proposal method.


        ***Note***: Custom proposal forms are not supported.'
      operationId: GETv3_proposals_CheckProposalCreation?SubscriberId={SubscriberId}&ProviderId={ProviderId}&LocationId={LocationId}&TradeId={TradeId}&Currency={Currency}
      parameters:
      - name: subscriberId
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: providerId
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: locationId
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: tradeId
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: currency
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The creation of a proposal is available. The proposal template is in the response.
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        '400':
          description: "The request is not accepted due to bad syntax, missing parameters, insufficient data, etc.\n            <br/>Error codes:\n            503 &mdash; ProviderId is not specified or incorrect\n            503 &mdash; SubscriberId is not specified or incorrect \n            503 &mdash; LocationId is not specified or incorrect \n            503 &mdash; TradeId is not specified or incorrect\n            503 &mdash; User ID does not match the logged-in user's credentials  \n            503 &mdash; Currency is not specified or incorrect \n            503 &mdash; Currencies are represented by 3 letters\n            503 &mdash; Proposal form is not supported via API. Please use the UI instead"

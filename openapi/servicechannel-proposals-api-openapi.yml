        type: array
        items:
          $ref: '#/definitions/ServiceChannel.Services.Messaging.Proposals.ProposalQuestion'
      Id:
        format: int32
        description: Unique numeric identifier of the proposal category.
        type: integer
      Name:
        description: Type of proposal categories, for example, *Materials*, *Installation Labor*, *Non-Installation Expenses*, etc.
        type: string
      TotalCost:
        format: double
        description: Subtotal for the specific cost type, for example, materials.
        type: number

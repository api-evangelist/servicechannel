      NoteType:
        description: "Type of the note:\r\n             • `SystemNote`: Notes added automatically by the system.\r\n             • `UsersNote`: Notes posted by users."
        type: string
      IsAttachmentNote:
        description: Indicates whether the note serves as an attachment note.
        default: false
        type: boolean
      IsPinned:
        description: "Indicates whether the note is pinned to the top of the notes list. Possible response values:\r\n             • `true`: The note is pinned, signifying the most important or pressing note right now for this work order. Only one note can be pinned on a single work order.\r\n             • `false`: The note isn’t pinned.\r\n            <br />Available with the *PinnedNotes* feature flag."
        default: false
        type: boolean
      ActionResolveDetails:
        $ref: '#/definitions/ServiceChannel.Services.WebApi.Models.Response.Notes.ActionResolveDetailsResponse'
        description: Applicable to notes that were marked with the **Action Required** flag. Shows whether the issue has been resolved.
  ServiceChannel.Services.WebApi.Models.Response.Notes.NoteAttachmentResponse:
    description: Represents the response details of a note attachment.
    type: object
    properties:
      Id:
        format: int32
        description: Unique numeric identifier of the attachment.
        type: integer
      Description:
        description: Description of the attachment.
        type: string
      Name:
        description: Filename of the attachment.
        type: string
      TimeStamp:
        format: date-time
        description: Date and time when the attachment was added to the work order or was modified. The format is `YYYY-MM-DDThh:mm:ss.ss`.
        type: string
      Uri:
        description: URI of the attachment.
        type: string
      NoteId:
        format: int64
        description: Unique numeric identifier of the note associated with the attachment.
        type: integer
      Visibility:
        format: int32
        description: "Visibility status of the attachment. Defines which parties can view the attachment. The *PrivateProviderNotesAndAttachments* feature should be enabled. For subscribers who are using Universal Connector, the *PrivateClientNotesAndAttachments* feature should be enabled.\r\n            Possible values:\r\n             • `0`: No restrictions on visibility. Visible to everyone.\r\n             • `1`: Not visible to the client. The subscriber deselected the **Visible to Client** checkmark when uploading an attachment or adding a note with an attachment.\r\n             • `2`: Not visible to the provider. The subscriber deselected the **Visible to Provider** checkmark when uploading an attachment or adding a note with an attachment.\r\n             • `3`: Visible to the subscriber only. The subscriber deselected the **Visible to Client** and **Visible to Provider** checkmarks when uploading an attachment or adding a note with an attachment."
        type: integer
      IsInvoiceDigitalCopy:
        description: "Indicates whether the attachment is a digital copy of an invoice. Possible response values: `true` and `false`.\r\n            <br />Available with the *InvoiceRequireDigitalCopy* feature flag."
        default: false
        type: boolean
  ServiceChannel.Services.Messaging.Attachments.Attachment:
    description: Object containing information about an attachment.
    type: object
    properties:
      Id:
        format: int32
        description: Unique numeric identifier of the attachment.
        type: integer
      Description:
        description: Optional text that a user added when uploading the attachment. The maximum character count is 200.
        type: string
      Name:
        description: Attachment name.
        type: string
      TimeStamp:
        format: date-time
        description: Date and time when the attachment was uploaded. The format is `YYYY-MM-DDThh:mm:ss.sss±hh:mm`, where `±hh:mm` represents the time zone offset from UTC.
        type: string
      Uri:
        description: Link address to the attachment in the ServiceChannel system.
        type: string
      NoteId:
        format: int64
        description: Unique numeric identifier of the note to which a user added the attachment.
        type: integer
      Visibility:
        format: int32
        description: "Visibility status of the attachment. Defines which parties can view the attachment. The *PrivateProviderNotesAndAttachments* feature should be enabled. For subscribers who are using Universal Connector, the *PrivateClientNotesAndAttachments* feature should be enabled.\r\n            <br />Possible values:\r\n             • `0`: No restrictions on visibility. Visible to everyone.\r\n             • `1`: Not visible to the client. The subscriber deselected the “Visible to Client” checkmark when uploading an attachment or adding a note with an attachment. \r\n             • `2`: Not visible to the provider. The subscriber deselected the “Visible to Provider” checkmark when uploading an attachment or adding a note with an attachment. \r\n             • `3`: Visible to the subscriber only. The subscriber deselected the “Visible to Client” and “Visible to Provider” checkmarks when uploading an attachment or adding a note with an attachment."
        type: integer
      IsInvoiceDigitalCopy:
        description: "Defines if the attachment is a digital copy of the provider’s invoice. According to subscriber configurations, some providers should attach digital copies of invoices.\r\n            Possible values: \r\n             • `true`: The attachment is an invoice digital copy. \r\n             • `false`: The attachment is not an invoice digital copy. \r\n            <br />***Note:*** Subscribers can set the requirement of a digital invoice copy from providers when the *InvoiceRequireDigitalCopy* feature is turned on."
        default: false
        type: boolean
      UploadBy:
        description: User who uploaded the attachment.
        type: string
  ServiceChannel.Services.Messaging.Workorders.AddFollowersRequest:
    required:
    - FollowersList
    - UserIds
    type: object
    properties:
      FollowersList:
        description: Required, Followers List
        type: string
      UserIds:
        description: Required, User Ids
        type: string
  ServiceChannel.Services.Messaging.Workorders.CreateWoNoteRequest:
    description: Represents a request to create a work order note.
    required:
    - Note
    type: object
    properties:
      Note:
        description: Note text. Required.
        type: string
      MailedTo:
        description: "Email address(es) of people who should receive an email notification about the new note. Separate multiple addresses with a semicolon.\r\n            <br />To prevent sending email alerts, leave it empty."
        type: string
      ActionRequired:
        description: 'Defines whether the note should be marked with the **Action Required** flag. Possible values: `true` and `false`.'
        default: false
        type: boolean
      ScheduledDate:
        format: date-time
        description: "Scheduled date of the work order. The format is `YYYY-MM-DDThh:mm:ss.sssZ`.\r\n            <br />To change the scheduled date of the work order via this method, ensure you have the *ChangeScheduledDateViaAddNoteApiMethod* feature turned on as well as the following permission enabled: *WorkOrderScheduledDateChange*.\r\n            <br />Without this feature and permission, the updated scheduled date will be reflected on the note but won’t automatically update the scheduled date on the work order.\r\n            <br />To prevent updating the scheduled date, leave the `ScheduledDate` empty."
        type: string
      FollowUpDate:
        format: date-time
        description: "To mark a note with the **Follow Up** flag, specify the follow-up date and time. It is used to revisit a work order at a later time, for example, to ensure the provider clocked in or updated the work order by the specified date. The format is `YYYY-MM-DDThh:mm:ss.sssZ`. Additionally, set the `IsFollowUpDateChanged` parameter to `true` if you specify the follow-up date.\r\n            <br />When no follow-up is required, leave it empty."
        type: string
      IsFollowUpDateChanged:
        description: "Indicates whether the follow-up date should be changed. Possible input values:\r\n             • Enter `true` if you specify the `FollowUpDate`.\r\n             • Enter `false` if you don't specify the `FollowUpDate`."
        default: false
        type: boolean
      AttachmentsIds:
        description: 'Attachment IDs that should be associated with the note. Only files already linked to the work order can be attached to the note. To get attachment IDs, run the following method: GET/odata/workorders({workorderId})/attachments.'
        type: array
        items:
          format: int32
          type: integer
      Visibility:
        format: int32
        description: "Defines which parties can view the note. Visibility also works in Universal Connector, where there are three primary parties: *Subscriber*, *External Subscriber*, and *Provider*. Possible input values: \r\n             • `0`: Visible to everyone (subscriber, external subscriber, provider).\r\n             • `1`: Visible to the subscriber and the provider. Not visible to the external subscriber.\r\n             • `2`: Visible to the subscriber and the external subscriber. Not visible to the provider.\r\n             • `3`: Visible to the subscriber only.\r\n            <br />Available with the *PrivateProviderNotesAndAttachments* feature flag. For Universal Connector clients, the *PrivateClientNotesAndAttachments* feature should be turned on."
        type: integer
      Actor:
        description: Defines who is adding a note.
        type: string
      NotifyFollowers:
        description: "Defines whether the WO followers should be notified about the new note. Possible values:\r\n             • `true`: WO followers will be notified.\r\n             • `false`: WO followers will not be notified."
        default: false
        type: boolean
      DoNotSendEmail:
        description: 'A flag indicating whether to suppress sending email notifications for the note. Possible input values: `true` and `false`.'
        default: false
        type: boolean
      IsPinned:
        description: "Indicates if the note should be pinned and displayed at the top of the notes list. Only one note can be pinned to a single work order.\r\n             • `true`: The note will be pinned.\r\n             • `false`: The note shouldn’t be pinned.\r\n            <br />Available to subscribers only — behind the *PinnedNotes* feature flag."
        default: false
        type: boolean
  ServiceChannel.Services.Messaging.Notes.EmailRecipientResponse:
    description: The email notification recipient object.
    type: object
    properties:
      Id:
        format: int32
        description: The unique numeric identifier of the user who can be added to the list of email notification recipients.
        type: integer
      UserName:
        description: The username of the email notification recipient.
        type: string
      Email:
        description: The email address of the notification recipient.
        type: string
      RecipientType:
        description: Defines the type of the email notification recipient.
        enum:
        - Undefined
        - RegularRecipient
        - Provider
        - Follower
        - LocationNoteRecipient
        type: string
  System.Object:
    type: object
    properties: {}
  ServiceChannel.Services.WebApi.Models.Response.Notes.ActionResolveDetailsResponse:
    description: Details regarding the resolution status of an action-required note.
    type: object
    properties:
      IsResolved:
        description: 'Indicates whether the action has been resolved. Possible response values: `true` and `false`. Applicable to work order notes that were marked with the **Action Required** flag.'
        default: false
        type: boolean
      ResolvedDate:
        format: date-time
        description: Date and time when the action was resolved. The format is `YYYY-MM-DDThh:mm:ss.ssssss`.
        type: string

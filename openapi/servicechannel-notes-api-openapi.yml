  ServiceChannel.Services.Messaging.Notes.ActionResolveDetails:
    description: Details regarding the resolution status of an action-required note.
    type: object
    properties:
      IsResolved:
        description: 'Indicates whether the action has been resolved. Possible response values: `true` and `false`. Applicable to work order notes that were marked with the **Action Required** flag.'
        default: false
        type: boolean
      ResolvedDate:
        format: date-time
        description: Date and time when the action was resolved. The format is `YYYY-MM-DDThh:mm:ss.sssss±hh:mm`, where `±hh:mm` represents the time zone offset from UTC.
        type: string
  ServiceChannel.Services.Messaging.Notes.Note:
    description: Object containing notes for the specified work order ID.
    type: object
    properties:
      Id:
        format: int64
        description: Unique numeric identifier of the work order note.
        type: integer
      DocumentId:
        description: UUID of the work order note.
        type: string
      GroupId:
        description: Numeric identifier of the note group. Some notes can have the same `GroupId`. For example, when a user note is posted along with a WO status change, the `GroupId` will be identical for these two notes. Referring to the `GroupId` helps you easily find the user note associated with the status change. Can be null (for example, for historical notes).
        type: string
      Number:
        format: int32
        description: Sequential number of the note.
        type: integer
      NoteData:
        description: Content of the note.
        type: string
      DateCreated:
        format: date-time
        description: Date and time when the note was added to the work order. The format is `YYYY-MM-DDThh:mm:ss.sssssss±hh:mm`, where `±hh:mm` represents the time zone offset from UTC.
        type: string
      ScheduledDate:
        format: date-time
        description: Scheduled date of the work order. The format is `YYYY-MM-DDThh:mm:ss±hh:mm`, where `±hh:mm` represents the time zone offset from UTC.
        type: string
      FollowUpDate:
        format: date-time
        description: Follow-up date specified on the note is used to revisit a work order at a later time, for example, to ensure the provider clocked in or updated the work order by the specified date. The format is `YYYY-MM-DDThh:mm:ss±hh:mm`, where `±hh:mm` represents the time zone offset from UTC.
        type: string
      ActionRequired:
        description: Indicates whether the recipient of the note is required to take further action on a work order. Check also the `ActionResolveDetails` parameter to see if the issue has been resolved.
        default: false
        type: boolean
      MailedTo:
        description: Email address(es) to which the note has been sent.
        type: string
      CreatedBy:
        description: Describes who created the note.
        type: string
      CompanyName:
        description: Describes who created the note. Works as the `CreatedBy` parameter. ***Note:*** Obsolete parameter.
        type: string
      Attachments:
        description: Files added along with the note.
        type: array
        items:
          $ref: '#/definitions/ServiceChannel.Services.Messaging.Attachments.Attachment'
      IsPinned:
        description: "Indicates whether the note is pinned to the top of the notes list. Possible response values:\r\n             • `true`: The note is pinned, signifying the most important or pressing note right now for this work order. Only one note can be pinned on a single work order.\r\n             • `false`: The note isn’t pinned.\r\n            <br />Available with the *PinnedNotes* feature flag."
        default: false
        type: boolean
      Visibility:
        format: byte
        description: "Defines which parties can view the note. Visibility also works in Universal Connector, where there are three primary parties: *Subscriber*, *External Subscriber*, and *Provider*. Possible response values:\r\n             • `0`: Visible to everyone (subscriber, external subscriber, provider). \r\n             • `1`: Visible to the subscriber and the provider. Not visible to the external subscriber.\r\n             • `2`: Visible to the subscriber and the external subscriber. Not visible to the provider.\r\n             • `3`: Visible to the subscriber only.\r\n            <br />Available with the *PrivateProviderNotesAndAttachments* feature flag. For Universal Connector clients, the *PrivateClientNotesAndAttachments* feature should be turned on."
        type: string
      NoteType:
        description: "Type of the note. Possible response values:\r\n             • `SystemNote`: Notes added automatically by the system.\r\n             • `UsersNote`: Notes posted by users."
        enum:
        - SystemNote
        - UsersNote
        type: string
      IsAttachmentNote:
        description: 'Specifies whether the WO note has attachments. Possible values: `true` and `false`.'
        default: false
        type: boolean
      ActionResolveDetails:
        $ref: '#/definitions/ServiceChannel.Services.Messaging.Notes.ActionResolveDetails'
        description: Applicable to notes that were marked with the **Action Required** flag. Shows whether the issue has been resolved.

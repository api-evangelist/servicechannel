  ServiceChannel.Services.Messaging.Workorders.CreateWoRequest:
    description: CreateWoRequest
    required:
    - ContractInfo
    - Category
    - CallDate
    - Description
    - ProblemCode
    type: object
    properties:
      Number:
        description: Work Order Number
        type: string
      PurchaseNumber:
        description: Purchase Order Number
        type: string
      HasTruncatedDescription:
        description: Optional
        default: false
        type: boolean
      ContractInfo:
        $ref: '#/definitions/ServiceChannel.Services.Messaging.Workorders.ContractInfo'
        description: "Required Contract Data Info to define ContractId.\r\n            Describes who, where and what will perform as well as the one who requested work"
      Comment:
        description: Optional, Gets or sets the comment. Describes comments in work order
        type: string
      SetupId:
        format: int32
        description: "Optional Dashboard Id, UID of dashboard from which this work order was created\r\n            must be bigger then zero and belong to existing dashboard"
        type: integer
      AssetId:
        format: int32
        description: "Optional Asset, UID of asset, that will be repaired/reinstalled\r\n            must be present and correspond to valid asset if system finds that asset exists for specified LocationId,\r\n            TradeName, IssueRequest.EquipmentType params and asset is required for issue choice specified by IssueRequest,\r\n            SubscriberId and SetupId params"
        type: integer
      ReplaceAsset:
        description: Optional
        default: false
        type: boolean
      CallerName:
        description: Optional, can be empty Caller Name. Name of the person/organization who created work order
        type: string
      Category:
        description: "Required, not empty Category must be valid category for specified subscriber. Describes what type of work will be performed.\r\n            This definition is broader then TradeName.\r\n            For example if TradeName is \"FLOOR MAINTENANCE\" then Category will be \"Maintenance\""
        type: string
      CategoryId:
        format: int32
        type: integer
      Priority:
        description: "Required, not empty Priority must be valid priority for specified subscriber. Describes work order priority.\r\n            For example \"Normal\", \"Emergency\""
        type: string
      PriorityId:
        format: int32
        type: integer
      Nte:
        format: double
        description: "Required Nte value; optional only for users that have no access to change NTE. (decimal number (e.g. 1.00)) - describes maximum amount of money to be spent on work order.\r\n            Must not exceed max amount defined by Subscriber.\r\n            If you specify ExtendedInfo.Tax, ExtendedInfo.Tax2 and ExtendedInfo.Price then Nte must be equal to sum of those three params"
        type: number
      CallDate:
        description: Required, date when work order was created.
        type: string
      CallDateDto:
        format: date-time
        description: Date when work order was created in DateTimeOffset format.
        type: string
      ScheduledDate:
        description: "Optional, calculated based on CallDate and Priority by default. Date when provider will come to perform work order.\r\n            Must be an actual date (i.e. not 1/1/1900 or 1/1/3001) + must be bigger then CallDate and smaller then ExpirationDate"
        type: string
      ScheduledDateDto:
        format: date-time
        description: Date when provider will come to perform work order in DateTimeOffset format.
        type: string
      CompletedDate:
        description: Optional, WorkDate when its not completed status.
        type: string
      ProblemSource:
        description: Optional, source from which the problem came from
        type: string
      Description:
        description: Required problem description, Must not be empty. Overall description of a problem (e.g. "Coffee machines are broken all over the place - please help!")
        type: string
      ProblemCode:
        description: Required, describes problem similar to Description attribute, but its value is predefined in subscriber's [IssueList].
        type: string
      RecallWorkOrder:
        format: int32
        description: Optional,  UID of recalled work order. Work order is set as 'recalled' when subscriber isn't satisfied with work that was done by provider
        type: integer
      ServiceNowId:
        description: Optional, Service Now Id
        type: string
      CurrencyId:
        format: int32
        description: "Optional, UID of currency used to pay for work order. Defaul value is '1' which corresponds to USD.\r\n            Must be bigger then 0 and correspond to valid currency in dashboard which is found by SetupId param"
        type: integer
      FollowupWorkOrder:
        format: int32
        description: Optional, UID of work order that is created if problem cannot be fully solved in terms of original work order
        type: integer
      ApprovalCode:
        description: Optional
        type: string
      IssueRequestInfo:
        $ref: '#/definitions/ServiceChannel.Services.Messaging.Workorders.CreateWoRequest.IssueRequest'
        description: Optional, describes problem in terms of [Dashboard] application
      DispatchSettingsInfo:
        $ref: '#/definitions/ServiceChannel.Services.Messaging.Workorders.CreateWoRequest.DispatchSettings'
        description: Describes email notification settings on work order creation
      Status:
        $ref: '#/definitions/ServiceChannel.Services.Messaging.Workorders.WorkorderStatus'
        description: Status
      ExtendedInfo:
        $ref: '#/definitions/ServiceChannel.Services.Messaging.Workorders.CreateWoRequest.ExtendedRequestInfo'
        description: Optional, extended status value
      Attachments:
        description: "Optional, at least one attachement must be present in list if system finds that attachments are required for issue choice specified by IssueRequest,\r\n            SubscriberId and SetupId params"
        type: array
        items:
          $ref: '#/definitions/ServiceChannel.Services.Messaging.Attachments.AddAttachmentRequest'
      IgnoreAttachmentsRequiredFlag:
        default: false
        type: boolean
      ApiRequest:
        default: false
        type: boolean
      Materials:
        description: Optional
        type: array
        items:
          $ref: '#/definitions/ServiceChannel.Services.Messaging.Workorders.CreateWoRequest.Material'
      MaterialsUsed:
        description: Optional
        type: array
        items:
          $ref: '#/definitions/ServiceChannel.Services.Messaging.RefrigerantTracking.AddWorkOrderPartRefrigerantItem'
      AdditionalFields:
        description: Interactive troubleshooting additional fileds
        type: array
        items:
          $ref: '#/definitions/ServiceChannel.Services.Messaging.Workorders.CreateWoRequest.AdditionalField'
      IssueListHeaderId:
        format: int32
        description: Optional. Id in dash_IssueListHeader table
        type: integer
      ProposedNte:
        format: double
        description: Optional
        type: number
      NotifyProvider:
        description: Optional
        default: false
        type: boolean
      IsDashboardRequest:
        description: Optional
        default: false
        type: boolean
      FloorPlansImagePath:
        description: Optional
        type: string
      AssigneeUserId:
        format: int32
        description: Optional
        type: integer
      SessionId:
        description: SessionId to link work order with feedback session
        type: string
      ProjectId:
        format: int32
        description: Optional. Project Id from Project Tracker
        type: integer
      WeatherTypeId:
        format: int32
        description: Optional. Associate with a specific weather type
        type: integer
      LabelId:
        format: int32
        description: Optional, Label Id
        type: integer
      Labels:
        description: Optional, Labels names
        type: array
        items:
          type: string
      AdditionalApprovalCodesList:
        description: Additional Approval Codes List with id as a key
        type: object
        additionalProperties:
          type: string
      LeaseNote:
        type: string
      UserName:
        type: string
      UserId:
        format: int32
        type: integer
      WorkFlowTypeId:
        format: int32
        type: integer
      EstimatedCompletionDate:
        format: date-time
        type: string
      IsAnomalyProviderOverwritten:
        description: Flag to show that Anomaly Override has happened.
        default: false
        type: boolean
      Anomaly:
        $ref: '#/definitions/ServiceChannel.Api.Model.Workorders.OverrideProperties.Anomaly'
        description: Info about work order anomaly (if it was found).
      DecisionAnswers:
        description: See {ServiceChannel.Services.Messaging.Workorders.GetWorkOrderPropertiesRequest.DecisionAnswers} for details
        type: array
        items:
          $ref: '#/definitions/DecisionAnswer'
      AssetNotListed:
        default: false
        type: boolean
      SpaceId:
        format: int32
        type: integer
      LocationPath:
        type: string

  ServiceChannel.Services.Messaging.Workorders.ContractInfo:
    description: ContractInfo (composite object) - describes who, where and what will perform as well as the one who requested work
    required:
    - SubscriberId
    - LocationId
    - TradeName
    type: object
    properties:
      SubscriberId:
        format: int32
        description: Required for provider request (for subscriber request filled authomatically), must belong to existing subscriber
        type: integer
      LocationId:
        format: int32
        description: "Required if 'StoreId' not passed, must belong to existing location for specified subscriber.\r\n            Can be Optional, if EquipmentId is supplied in the request, system picks LocationId of the location that equipment belongs to"
        type: integer
      StoreId:
        description: "Optional, can be used instead of 'LocationId'.\r\n            If 'LocationId' not passed system will attempt to find location based on 'SubscriberId' and 'StoreId'\r\n            ('StoreId' is required in this case), it is possible that system won't be able to find location which results in error.\r\n            Many locations can have similar StoreId but LocationId is always unique"
        type: string
      ProviderId:
        format: int32
        description: "Optional (for provider request filled authomatically), if provided - must correspond to a valid provider that has contract\r\n            for specified Subscriber, Location and Trade.\r\n            If not specified the system will attempt to find default provider based on Location, \r\n            Trade and Equipment (if specified). It is possible that system won't be able to find provider which results in error"
        type: integer
      TradeName:
        description: "Required, must be a valid trade for specified subscriber.\r\n            Can be Optional if EquipmentId is supplied in the request, system picks TradeName of the trade that equipment belongs to.\r\n            This definition is narrower then Category. For example if Category is \"Maintenance\" then TradeName will be \"FLOOR MAINTENANCE\""
        type: string
      TradeId:
        format: int32
        description: Required, must be a valid trade id for specified subscriber.
        type: integer
      IsTradeDeleted:
        default: false
        type: boolean

        description: Indicates whether the work order avoids the failure criteria.
        default: false
        type: boolean
  ServiceChannel.Services.Messaging.Assets.Warranty:
    description: Object containing warranty parameters.
    type: object
    properties:
      ExpirationDate:
        format: date-time
        description: Warranty expiration date based on the warranty expiration settings.
        type: string
      ProviderId:
        format: int32
        description: ID of a provider who is in charge of warranty services.
        type: integer
      NTE:
        format: double
        description: Maximum amount of money to be spent on warranty services in USD. Value -1  means that the amount is not applicable.
        type: number
      Priority:
        description: Defines how quickly warranty services should be provided, for example, *Emergency-4 Hours*, *Normal-48 Hours*, *7 Days*.
        type: string
      PriorityId:
        format: int32
        type: integer
      Category:
        description: Warranty category, for example, *ADVISE ONLY*, *REPAIR*, *DISASTER*.
        type: string
      CategoryId:
        format: int32
        type: integer
      Provider:
        $ref: '#/definitions/ServiceChannel.Services.Messaging.Assets.WarrantyProvider'
        description: Rules to choose Warranty Provider
      Expiration:
        $ref: '#/definitions/ServiceChannel.Services.Messaging.Assets.WarrantyExpiration'
        description: Rules for Warranty Expiration
  ServiceChannel.Services.WebApi.Models.Response.WorkOrder.GetWorkOrdersResponse.Currency:
    description: Currency information.
    type: object
    properties:
      Id:
        format: int32
        description: Currency identifier.
        type: integer
      AlphabeticalCode:
        description: Alphabetical currency code.
        type: string
      Rate:
        format: double
        description: Exchange rate.
        type: number
  ServiceChannel.Services.WebApi.Models.Response.Checklists.ChecklistResponses.CheckListDetailQuestionsExtendedResponse:
    description: Checklist question details.
    type: object
    properties:
      CheckListCreatedDate:
        format: date-time
        description: Date and time when the checklist was created.
        type: string
      CheckListName:
        description: Name of the checklist the question belongs to.
        type: string
      Id:
        format: int32
        description: Checklist question ID.
        type: integer
      CheckListId:
        format: int32
        description: ID of the checklist the question belongs to.
        type: integer
      Question:
        description: Checklist question that a technician is prompted to answer when working on a service request.
        type: string
      ShortDescription:
        description: Not applicable to checklists.
        type: string
      AnswerRequired:
        description: Defines whether answering this checklist question is mandatory.
        default: false
        type: boolean
      PictureFlag:
        description: "Defines whether a technician is required to upload an attachment when answering the question:\r\n             • 0 — Adding an attachment is optional.\r\n             • 1 — An attachment is not required.\r\n             • 2 — Uploading an attachment is mandatory."
        enum:
        - Optional
        - 'No'
        - Required
        type: string
      Sequence:
        format: int32
        description: Not applicable to checklists.
        type: integer
      QuestionType:
        description: "[Checklist question type](/guides/checklists/types-of-checklist-questions/):\r\n             • 0 — **Acknowledgement**: Represents an on/off toggle prompting a technician to give a positive or negative response to a question.\r\n             • 1 — **Selector**: Provides multiple configured answer options to choose from.\r\n             • 2 — **Text Entry**: Allows entering a text answer.\r\n             • 4 — **Numeric Input**: Prompts to submit a number as a response."
        enum:
        - CheckBox
        - RadioButton
        - TextEntry
        - TriState
        - NumericInput
        type: string
      CheckListQuestionOptions:
        description: Answer options for questions of the Selector type.
        type: array
        items:
          $ref: '#/definitions/ServiceChannel.Services.WebApi.Models.Response.Checklists.ChecklistResponses.ChecklistQuestionOptionResponse'
      AnswerCanPersist:
        description: Defines whether the answer to this question can persist. If the answer is persistent, the last submitted response populates on the question. A technician can either opt for the current response or update it.
        default: false
        type: boolean
      CheckListTimingType:
        description: 'Defines the checklist segment the question belongs to: 1 — check-in segment, 2 — check-out segment.'
        enum:
        - CheckIn
        - CheckOut
        type: string
      AcknowledgeUrl:
        $ref: '#/definitions/ServiceChannel.Services.WebApi.Models.Response.Checklists.ChecklistResponses.CheckListAcknowledgeUrlResponse'
        description: AcknowledgeUrl
      AllowMultiSelect:
        description: AllowMultiSelect
        default: false
        type: boolean
      ChecklistFailure:
        description: ChecklistFailure
        default: false
        type: boolean
      AssetTypeIds:
        description: Asset type IDs that the question is applicable to
        type: array
        items:
          format: int32
          type: integer
      ChecklistQuestionNumericType:
        $ref: '#/definitions/ServiceChannel.Services.WebApi.Models.Response.Checklists.ChecklistResponses.ChecklistQuestionNumericType'
        description: Answer option of the Numeric type question
  ServiceChannel.Services.Messaging.Workorders.WorkOrderAnalyticsResponse:
    type: object
    properties:
      IVR:
        description: 'Indicates whether the work order has both Check-In and Check-Out records and completes with a Check-Out. **Possible values**: *true*, *false*.'
        default: false
        type: boolean
      SLA:
        description: 'Indicates whether the work order met the original ETA. **Possible values**: *true*, *false*, or *null* (if the `Original ETA` or `CheckInTime` is not populated in source data).'
        default: false
        type: boolean
      FirstTimeCompletionFlag:
        format: int32
        description: 'Indicates whether the work order was completed on the first visit. **Possible values**: `1` - *Yes*, `0` - *No*.'
        type: integer
  ServiceChannel.Services.Messaging.RefrigerantTracking.RefrigerantUseReasonCode:
    description: Object containing refrigerant use reasons.
    type: object
    properties:
      Id:
        format: int32
        description: Unique numeric identifier of the refrigerant use reason code.
        type: integer
      Order:
        format: int32
        description: Order of appearance of a reason code.
        type: integer
      Purpose:
        format: int32
        description: "Unique numeric identifier of the reason code for the refrigerant part use. Possible values: `0` - Leak, `1` - InitialCharge, `2` - SystemExpansion, `3` - Removal, `4` - Other, `5` - RemovedReused, `6` - Retrofit.\r\n            <br />Each reason code on the subscriber side is associated with a hardcoded purpose value in the database. Since reason codes can vary across subscribers, the purpose helps identify the valid reason code.\r\n            <br />***Note:*** Purpose value `0` is assigned to the `Leak` and `Repair` reason codes, indicating that a leak record gets calculated for these reason codes."
        type: integer
      Name:
        description: "Reason code name for the refrigerant part use as configured by the subscriber. Possible values:\r\n             • `Leak`\r\n             • `Repair`\r\n             • `Adjustment`\r\n             • `System Expansion`\r\n             • `Removal`\r\n             • `Initial Charge`\r\n             • `Retrofit`\r\n             • `Removed Reused`"
        type: string
      SubscriberId:
        format: int32
        description: Unique numeric identifier of the subscriber.
        type: integer
      IsActive:
        description: "Defines whether a user can select a reason code when capturing refrigerant use. Possible response values:\r\n             • `true`: Reason code is enabled.\r\n             • `false`: Reason code is disabled."
        default: false
        type: boolean
  ServiceChannel.Services.WebApi.Models.Response.WorkOrder.GetWorkOrdersResponse.Location:
    description: Location associated with a work order.
    type: object
    properties:
      Id:
        format: int32
        description: Unique location identifier.
        type: integer
      SubscriberId:
        format: int32
        description: Unique subscriber identifier.
        type: integer
      StoreId:
        description: Alphanumeric identifier of the store in the client's system. Assigned by and unique per subscriber.
        type: string
      Name:
        description: Location name.
        type: string
      ShortName:
        description: Shortened location name.
        type: string
      Latitude:
        format: double
        description: Global position. Latitude.
        type: number
      Longitude:
        format: double
        description: Global position. Longitude.
        type: number
      Distance:
        format: double
        description: Distance from GPS coordinate to this location.
        type: number
      Address1:
        description: Additional location address.
        type: string
      Address2:
        description: Main location address.
        type: string
      City:
        description: Location city.
        type: string
      State:
        description: State where the location is situated.
        type: string
      Zip:
        description: Location ZIP or postal code.
        type: string
      TimeZoneInfoId:
        format: int32
        description: Numeric identifier of the location time zone.
        type: integer
      Notes:
        description: Location notes.
        type: array
        items:
          $ref: '#/definitions/ServiceChannel.Services.WebApi.Models.Response.WorkOrder.GetWorkOrdersResponse.LocationNote'
      TimeShiftToEST:
        format: int32
        description: Time shift to Eastern Standard Time.
        type: integer
      AddressTypeId:
        format: int32
        description: Address format pattern Id.
        type: integer
      IsInternational:
        description: Indicates if the location is international.
        default: false
        type: boolean
  ServiceChannel.Services.Messaging.Workorders.CheckInRequest:
    description: Check-in request
    required:
    - Latitude
    - Longitude
    type: object
    properties:
      WorkTypeId:
        format: int32
        description: "The unique ID of the work type.\r\n            **Possible values:** `1` — Repair, `2` — Travel. Other values are possible when custom types are set up for the subscriber.\r\n            **Default value:** 1."
        type: integer
      UserId:
        format: int32
        description: "The user ID of the technician that is checking in. Use the same `UserId` for one pair of check-in and check-out records.\r\n            **Default value:** ID of the current user."
        type: integer
      TechsCount:
        format: int32
        description: "The number of technicians that are checking in.\r\n            **Default value:** 1."
        type: integer
      Latitude:
        format: double
        description: "The latitude of the technician’s current position.\r\n            Required for the Repair type. Not required for the Travel and custom types as well as for the Repair type when the [XML check-in/out permission](/guides/checkin/before-you-start/#xml-check-inout-permission) is enabled."

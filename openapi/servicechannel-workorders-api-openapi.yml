  ServiceChannel.Services.Messaging.Workorders.CheckOutRequest:
    description: Check-out request
    required:
    - Latitude
    - Longitude
    type: object
    properties:
      WorkTypeId:
        format: int32
        description: "The unique ID of the work type.\r\n            **Possible values:** `1` — Repair, `2` — Travel. Other values are possible when custom types are set up for the subscriber.\r\n            **Default value:** 1."
        type: integer
      PrimaryStatus:
        description: "The status that is set for the WO when checking out.\r\n            Required for the Repair type. Ignored for the Travel and custom types as well when `ActionStatus` = `Cancel`.\r\n            **Default value:** NoStatusChange."
        enum:
        - NoStatusChange
        - InProgress
        - Completed
        - WaitingForQuote
        - PartsOnOrder
        - Incomplete
        type: string
      ExtendedStatus:
        description: "The extended status that is set for the WO when checking out.\r\n            Optional for the Repair type. Ignored for the Travel and custom types, when `ActionStatus` = `Cancel`, and for 'Completed' PrimaryStatus (generated automatically).\r\n            Refrigerant WO with 'Completed' PrimaryStatus — special case by RefrigerationTracking feature."
        type: string
      ActionStatus:
        description: "The status of the activity.\r\n            **Possible values:** `Complete`, `Cancel`. Both values result in recording a check-out.\r\n            `Complete` means that the technician has finished the activity. `Cancel` means the technician needs to pause the activity, for example, to have a break outside of the location. GPS coordinates are not required.\r\n            **Default value:** Complete."
        enum:
        - Complete
        - Cancel
        type: string
      Resolution:
        description: "The comment entered when checking out. Usually describes what was done during the recorded time. Ignored for the Travel and custom types as well as when `ActionStatus` = `Cancel`.\r\n            **Default value:** empty."
        type: string
      UserId:
        format: int32
        description: "The user ID of the technician that is checking out. Use the same `UserId` for one pair of check-in and check-out records.\r\n            **Default value:** ID of the current user."
        type: integer
      TechsCount:
        format: int32
        description: "The number of technicians that are checking out.\r\n            **Default value:** 1."
        type: integer
      Latitude:
        format: double
        description: "The latitude of the technician’s current position.\r\n            Required for the Repair and Travel type. Not required for custom types, for the Repair and Travel types when the [XML check-in/out permission](/guides/checkin/before-you-start/#xml-check-inout-permission) is enabled, and when `ActionStatus` = `Cancel`."
        type: number
      Longitude:
        format: double
        description: "The longitude of the technician’s current position.\r\n            Required for the Repair and Travel type. Not required for custom types, for the Repair and Travel types when the [XML check-in/out permission](/guides/checkin/before-you-start/#xml-check-inout-permission) is enabled, and when `ActionStatus` = `Cancel`."
        type: number
      CheckOutTime:
        format: date-time
        description: "The date and time of the check-out. Either indicate in UTC or pass the current time and add the UTC offset.\r\n            You can pass this value only when the [XML check-in/out permission](/guides/checkin/before-you-start/#xml-check-inout-permission) is enabled.\r\n            **Default value:** current date and time."
        type: string
      CheckoutAll:
        default: false
        type: boolean
      Actor:
        description: Optional, Actor
        type: string
      SignatureAttachmentId:
        format: int32
        description: "Optional, SignatureAttachmentId\r\n            **Default value:** null"
        type: integer
      UnableObtainSignatureNoteId:
        format: int64
        description: "Optional, UnableObtainSignatureNoteId\r\n            **Default value:** null"
        type: integer
      UnableObtainSignatureNoteDocumentId:
        description: "Optional, UnableObtainSignatureNoteDocumentId\r\n            **Default value:** null"
        type: string

  ServiceChannel.Services.WebApi.Models.Response.Checklists.ChecklistResponses.ChecklistResponse:
    description: Checklist response object.
    type: object
    properties:
      Id:
        format: int32
        description: Checklist response ID.
        type: integer
      Answer:
        description: Answer to a checklist question.
        type: string
      FreeTextAnswer:
        description: Comment to an answer option with the `IsConditionalFollowUp` attribute. Answer options are configured for questions of the **Selector** type.
        type: string
      EntityId:
        format: int32
        description: ID of the work order the response was submitted for.
        type: integer
      EntityTypeId:
        format: int32
        description: ID of the entity the response was submitted for. 0 is returned for work orders.
        type: integer
      Attempt:
        format: int32
        description: Order of a technician’s on-site visit when the response was submitted.
        type: integer
      ProviderId:
        format: int32
        description: ID of the provider on whose behalf the response was submitted.
        type: integer
      TechnicianId:
        format: int32
        description: ID of the technician on whose behalf the response was submitted.
        type: integer
      UpdatedDate:
        format: date-time
        description: Date and time when the response was last updated set in EST. The format is `YYYY-MM-DDThh:mm:ss.sss`.
        type: string
      UpdatedDateStr:
        description: Date and time when the response was last updated set in the location’s time zone. The format is `Month Day Year hh:mm`.
        type: string
      UpdatedDateDto:
        format: date-time
        description: Date and time when the response was last updated set in the location’s time zone with the UTC offset. The format is `YYYY-MM-DDThh:mm:ss.sss±hh:mm`.
        type: string
      CheckListQuestionId:
        format: int32
        description: ID of the checklist question the response was submitted for.
        type: integer
      QuestionOptions:
        description: List of the answer options configured for a checklist question of the **Selector** type where multiple options can be selected.
        type: array
        items:
          $ref: '#/definitions/ServiceChannel.Services.WebApi.Models.Response.Checklists.ChecklistResponses.ChecklistQuestionOptionResponse'
      CheckListQuestionOptionId:
        format: int32
        description: ID of the answer option configured for a checklist question of the **Selector** type.
        type: integer
      AssetId:
        format: int32
        description: ID of the asset for which the response was submitted.
        type: integer
      IsPassed:
        description: Indicates whether the response avoids the failure criteria.
        default: false
        type: boolean
      LinkedWorkOrderId:
        format: int32
        description: "ID of the linked work order if the response results in a failure and generates a linked work order.\r\n            Null if the response does not result in a failure or if the failure does not generate a linked work order."
        type: integer
  ServiceChannel.Services.WebApi.Models.Response.Checklists.ChecklistResponses.ChecklistQuestionOptionResponse:
    description: Answer option configured for a checklist question of the **Selector** type.
    type: object
    properties:
      Id:
        format: int32
        description: ID of the answer option for a checklist question of the **Selector** type.
        type: integer
      Answer:
        description: Answer option for a checklist question of the **Selector** type. A technician can select from a list of configured options when answering the question.
        type: string
      Sequence:
        format: int32
        description: Not applicable to checklists.
        type: integer
      IsConditionalFollowUp:
        description: Defines whether a technician is prompted to add a comment to the selected answer option. A comment is mandatory if answering the checklist question is required.
        default: false
        type: boolean
      ResponseResultInFailure:
        description: Option for a checklist question of the **Selector** type.
        default: false
        type: boolean

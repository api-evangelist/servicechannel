  ServiceChannel.Services.WebApi.Models.Response.Checklists.ChecklistSettingsResponses.CheckListDetailQuestionsResponse:
    description: Represents the details of a checklist question, including its properties and configuration options.
    type: object
    properties:
      Id:
        format: int32
        description: Gets or sets the unique identifier of the checklist question.
        type: integer
      CheckListId:
        format: int32
        description: Gets or sets the ID of the checklist to which the question belongs.
        type: integer
      Question:
        description: Gets or sets the question that a technician is prompted to answer when working on a service request.
        type: string
      ShortDescription:
        description: Gets or sets the short description, although it's noted as not applicable to checklists.
        type: string
      AnswerRequired:
        description: Gets or sets a value indicating whether answering this checklist question is mandatory.
        default: false
        type: boolean
      PictureFlag:
        description: "Gets or sets the requirement level for uploading an attachment when answering the question.\r\n            <list type=\"bullet\"><item><description>0 — Adding an attachment is optional.</description></item><item><description>1 — An attachment is not required.</description></item><item><description>2 — Uploading an attachment is mandatory.</description></item></list>"
        enum:
        - Optional
        - 'No'
        - Required
        type: string
      Sequence:
        format: int32
        description: Gets or sets the sequence number, noted as not applicable to checklists.
        type: integer
      QuestionType:
        description: "Gets or sets the type of the checklist question.\r\n            <list type=\"bullet\"><item><description>0 — <strong>Acknowledgement</strong>: Represents an on/off toggle prompting a technician to give a positive or negative response to a question.</description></item><item><description>1 — <strong>Selector</strong>: Provides multiple configured answer options to choose from.</description></item><item><description>2 — <strong>Text Entry</strong>: Allows entering a text answer.</description></item><item><description>4 — <strong>Numeric Input</strong>: Prompts to submit a number as a response.</description></item></list>"
        enum:
        - CheckBox
        - RadioButton
        - TextEntry
        - TriState
        - NumericInput
        type: string
      CheckListQuestionOptions:
        description: Gets or sets the answer options for questions of the Selector type.
        type: array
        items:
          $ref: '#/definitions/ServiceChannel.Services.WebApi.Models.Response.Checklists.ChecklistSettingsResponses.CheckListQuestionOptionResponse'
      AnswerCanPersist:
        description: "Gets or sets a value indicating whether the answer to this question can persist.\r\n            If the answer is persistent, the last submitted response populates on the question.\r\n            A technician can either opt for the current response or update it."
        default: false
        type: boolean
      CheckListTimingType:
        description: "Gets or sets the checklist segment the question belongs to:\r\n            1 — check-in segment, 2 — check-out segment."
        enum:
        - CheckIn
        - CheckOut
        type: string
      AcknowledgeUrl:
        $ref: '#/definitions/ServiceChannel.Services.WebApi.Models.Response.Checklists.ChecklistSettingsResponses.CheckListAcknowledgeUrlResponse'
        description: Gets or sets the acknowledge URL for special checklist types.
      AllowMultiSelect:
        description: Gets or sets a value indicating whether multiple selections are allowed for this question.
        default: false
        type: boolean
      ChecklistFailure:
        description: Gets or sets a value indicating whether this question contributes to a checklist failure.
        default: false
        type: boolean
      AssetTypeIds:
        description: Gets or sets the list of asset type IDs to which the question is applicable.
        type: array
        items:
          format: int32
          type: integer
      CheckListQuestionNumericType:
        $ref: '#/definitions/ServiceChannel.Services.WebApi.Models.Response.Checklists.ChecklistSettingsResponses.CheckListQuestionNumericTypeResponse'
        description: Gets or sets the answer option of the Numeric type question.

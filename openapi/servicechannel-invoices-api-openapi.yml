      IsOffShore:
        description: Type of the shore (`1` - Onshore, `2` - Offshore).
        default: false
        type: boolean
      ApprovalCodeGroup:
        $ref: '#/definitions/ServiceChannel.Services.Messaging.Invoices.InvoiceApprovalCodeGroup'
      isNontaxableVATEU:
        default: false
        type: boolean
  ServiceChannel.Services.Messaging.Invoices.Tax2Details:
    description: Information on the additional tax. Only invoices for Canadian locations can have Tax2Details.
    type: object
    properties:
      Tax2Amount:
        format: double
        description: Amount of the additional tax.
        type: number
      Tax2Name:
        description: Name of the additional tax, for example, *VAT*, *HST*, *PST*, or *QST*.
        type: string
  ServiceChannel.Services.Messaging.ApprovalCodes.AdditionalApprovalCodeOption:
    type: object
    properties:
      Id:
        format: int32
        type: integer
      Value:
        type: string
  ServiceChannel.Services.Messaging.Invoices.InvoicePaymentResponse:
    description: Object containing the invoice payment details.
    type: object
    properties:
      Id:
        format: int32
        description: Numeric identifier of the payment.
        type: integer
      PaymentDate:
        format: date-time
        description: Date and time when the specified invoice was paid.
        type: string
      PaidBy:
        description: Username of the employee who made the payment.
        type: string
      PaymentNumber:
        description: Order number of payment.
        type: string
      PaymentAmount:
        format: double
        description: Amount paid for the invoice. The value is negative if it’s a credited invoice.
        type: number

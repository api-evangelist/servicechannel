  /invoices/ping/{serviceName}:
    get:
      tags:
      - Invoices
      summary: Checks state of a service for invoice.
      description: 'The method allow check some service for invoice for availability state.<br />Responses: ''Success'' or ''Fail''.'
      operationId: GETv3_invoices_ping_{serviceName}
      consumes: []
      produces:
      - application/json
      - text/json
      parameters:
      - name: serviceName
        in: path
        description: 'Service Name identifier: The value of parameter is ''TWUtilityManager'' or ''TWCalculationManager''  in currently.'
        required: true
        type: string
      responses:
        '200':
          description: Indicates that the request succeeded. Specified service is available.
          schema:
            $ref: '#/definitions/System.Object'
        '400':
          description: Indicates that the request failed. Action parameter is mismatched or missed.
          schema:
            $ref: '#/definitions/System.Object'
        '401':
          description: An unauthorized request.
        '503':
          description: Indicates that the request failed. Specified service is unavailable.

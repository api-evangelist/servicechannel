  /odata/invoices:
    get:
      tags:
      - Invoices
      summary: Retrieve Invoices
      description: Returns a list of invoices posted within the last 90 days if not specified otherwise in `$filter`. The maximum date range between the invoice `PostedDate` and the current date is 365 days.
      operationId: Invoices_GetInvoices
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: $expand
        in: query
        description: Expand a navigation property.
        required: false
        type: string
      - name: $select

openapi: 3.2.0
info:
  version: '3'
  title: ServiceChannel API - v.3 Locations API
  description: The ServiceChannel API is a RESTful and stateless API.
servers:
- url: https://sb2api.servicechannel.com/v3
security:
- oauth2: []
tags:
- name: Locations
paths:
  /stores:
    get:
      tags:
      - Locations
      summary: Retrieve stores
      description: 'Returns a list of all Locations, also called Stores, if neither of the filters is used. You can get the details for a certain store by specifying any of the following parameters: `Id`, `storeIdentifier`, `name`.


        You can use either of these methods to get a list of the subscriber’s locations: GET /locations, GET /stores.


        Visit ServiceChannel University to find out more about locations and provider assignments.'
      operationId: GETv3_stores?Id={Id}&storeIdentifier={storeIdentifier}&Name={Name}&Sort={Sort}&Page={Page}&PageSize={PageSize}
      parameters:
      - name: id
        in: query
        description: Unique location identifier.
        required: false
        schema:
          type: integer
          format: int32
      - name: storeIdentifier
        in: query
        description: Alphanumeric location identifier in the client’s system. Assigned by and unique per subscriber.
        required: false
        schema:
          type: string
      - name: name
        in: query
        description: Location name.
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: Sort resources by the specified property in the response.
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Results page number.
        required: false
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: Number of objects on the results page. The default and maximum per page is 50.
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The requested locations are in the response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.Location.GetLocationsWithTotalResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.Location.GetLocationsWithTotalResponse'
        '400':
          description: "The request is not accepted due to bad syntax, missing parameters, insufficient data, etc\n            <br/>Error codes: \n            502 — Subscriber not found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
        '401':
          description: "The request is not authorized.\n            <br/>Error codes:\n            504 - API call rejected by security permissions\n            100 — User has no permissions to perform this action"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
        '500':
          description: "The server was unable to complete the request due to an internal error. \n            <br/>Error codes:\n            501 — “Location ID” is not a valid value for Int32\n            "
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
      deprecated: false
      x-access: Any
  /locations:
    get:
      tags:
      - Locations
      summary: Retrieve stores
      description: 'Returns a list of all Locations, also called Stores, if neither of the filters is used. You can get the details for a certain store by specifying any of the following parameters: `Id`, `storeIdentifier`, `name`.


        You can use either of these methods to get a list of the subscriber’s locations: GET /locations, GET /stores.


        Visit ServiceChannel University to find out more about locations and provider assignments.'
      operationId: GETv3_locations?Id={Id}&storeIdentifier={storeIdentifier}&Name={Name}&Sort={Sort}&Page={Page}&PageSize={PageSize}
      parameters:
      - name: id
        in: query
        description: Unique location identifier.
        required: false
        schema:
          type: integer
          format: int32
      - name: storeIdentifier
        in: query
        description: Alphanumeric location identifier in the client’s system. Assigned by and unique per subscriber.
        required: false
        schema:
          type: string
      - name: name
        in: query
        description: Location name.
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: Sort resources by the specified property in the response.
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Results page number.
        required: false
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: Number of objects on the results page. The default and maximum per page is 50.
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The requested locations are in the response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.Location.GetLocationsWithTotalResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.Location.GetLocationsWithTotalResponse'
        '400':
          description: "The request is not accepted due to bad syntax, missing parameters, insufficient data, etc\n            <br/>Error codes: \n            502 — Subscriber not found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
        '401':
          description: "The request is not authorized.\n            <br/>Error codes:\n            504 - API call rejected by security permissions\n            100 — User has no permissions to perform this action"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
        '500':
          description: "The server was unable to complete the request due to an internal error. \n            <br/>Error codes:\n            501 — “Location ID” is not a valid value for Int32\n            "
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
      deprecated: false
      x-access: Any
  /subscribers/current/users/current/stores:
    get:
      tags:
      - Locations
      summary: Get stores
      description: 'Returns a list of stores with the LocationIDs and subscriber IDs, along with the location address details. The method is available to subscribers only.


        To get more detailed information, use one of these methods: GET /stores, GET /locations, GET /odata/locations.


        Learn about updating location details in ServiceChannel University.'
      operationId: GETv3_subscribers_current_users_current_stores
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/System.Object'
            text/json:
              schema:
                $ref: '#/components/schemas/System.Object'
      deprecated: false
      x-access: Any
  /locations/{locationId}:
    get:
      tags:
      - Locations
      summary: Retrieve a location
      description: 'Returns the details for the specified location.


        To receive details of several locations, use one of these methods: GET /stores, GET /locations, GET /odata/locations.'
      operationId: GETv3_locations_{locationId}
      parameters:
      - name: locationId
        in: path
        description: Unique numeric identifier of the location to return the details for.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The specified location details are in the response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.Location.LocationWithTimezoneName'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.Location.LocationWithTimezoneName'
        '400':
          description: "The request is not accepted due to bad syntax, missing parameters, insufficient data, etc.\n            <br/>Error codes:\n            601 — Location is not found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
        '401':
          description: "The request is not authorized.\n            <br/>Error codes:\n            504 — API call rejected by security permissions"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
        '500':
          description: The server was unable to complete the request due to an internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
      deprecated: false
      x-access: Any
    put:
      tags:
      - Locations
      summary: Update a location
      description: 'Modifies information of the existing location.You can use either of the following methods to retrieve location details: GET/stores, GET/locations.


        ***Note:*** Method is available for subscribers with the *Super Admin* permission or *SC Admin* role.


        Visit ServiceChannel University to find out how subscribers can update location details.


        **Example request**


        PUT / locations/{locationId}

        {

        "StoreId": "34",

        "Name": "CSR Flagship",

        "Latitude": 40.736601,

        "Longitude": -73.991795,

        "Distance": null,

        "Address1": "3rd Floor, Innovation Center",

        "Address2": "18 E. 16th Street",

        "City": "New York",

        "State": "NY",

        "StateId": 1,

        "Region": "Northeast",

        "District": "NYC/LI",

        "Zip": "10003",

        "Country": "US",

        "CountryId": 1,

        "ClosedDate": "null",

        "OpenDate": "2021-07-05T07:05:04.991Z",

        "Email": "flagship@gmail.com",

        "Phone": "212-555-1212",

        "Contact": "",

        "FaxNumber": "",

        "LocationTypeId": null,

        "SquareValue": 20.21

        "SquareMeasure": "ft or foot" or "m or metre"

        }'
      operationId: PUTv3_locations_{locationId}
      parameters:
      - name: locationId
        in: path
        description: Unique identifier of the subscriber’s location which information you want to update.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The location details are updated.
        '400':
          description: "The request is not accepted due to bad syntax, missing parameters, insufficient data, etc.\n            <br/>Error codes:\n            601 — Location not found\n            1254 — Invalid square measure"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
        '401':
          description: "The request is not authorized.\n            <br/>Error codes:\n            504 — API call rejected by security permissions"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
        '500':
          description: The server was unable to complete the request due to an internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
      deprecated: false
      x-access: Subscribers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceChannel.Services.Messaging.Location.UpdateLocationExRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ServiceChannel.Services.Messaging.Location.UpdateLocationExRequest'
        description: Request to change the location details. Leaving a parameter empty or excluding it from the request model erases the already existing data.
        required: true
  /locations/{locationId}/notes:
    get:
      tags:
      - Locations
      summary: Retrieve location notes
      description: Returns the location notes for the specified location.
      operationId: GETv3_locations_{locationId}_notes?privateNotes={privateNotes}
      parameters:
      - name: locationId
        in: path
        description: Unique ID of the location you want to receive notes for.
        required: true
        schema:
          type: integer
          format: int32
      - name: privateNotes
        in: query
        description: Should privateNotes be included. Settings from dashboardSetup by default
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Location notes are in the response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.LocationNote.LocationNote'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.LocationNote.LocationNote'
        '400':
          description: "The request is not accepted due to bad syntax, missing parameters, insufficient data, etc.\n            <br/>Error codes:\n            601 — Location not found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
        '401':
          description: "The request is not authorized.\n            <br/>Error codes:\n            504 - API call rejected by security permissions"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
        '500':
          description: The server was unable to complete the request due to an internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
      deprecated: false
      x-access: Any
    post:
      tags:
      - Locations
      summary: Add a location note
      description: 'Adds a location note for the specified location. If a note is already added, you can change it by sending the request, or leave the `Value` parameter empty to delete the note.


        To retrieve location IDs along with the location notes, send either of these requests: GET/stores, GET/locations.

        Get location notes separately for the specified location by sending the GET/locations/{locationId}/notes request.


        ***Note***: Method is available for users with the *Super Admin* or *Admin* roles, or the *Location Admin* permission.


        **Example request**


        POST /locations/{locationId}/notes

        {

        "Header": "Location Manager",

        "Value": "John Smith"

        }'
      operationId: POSTv3_locations_{locationId}_notes
      parameters:
      - name: locationId
        in: path
        description: Unique ID of the location you want to update a note for.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The note is added to the specified location.
        '400':
          description: "The request is not accepted due to bad syntax, missing parameters, insufficient data, etc.\n            <br/>Error codes:\n            601 — Location is not found\n            1301 — Request is empty or null"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
        '401':
          description: "The request is not authorized.\n            <br/>Error codes:\n            504 — API call rejected by security permissions"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
        '403':
          description: "You are not authorized to request this resource, or the resource is unavailable for some reason.\n            <br/>Error codes:\n            100 — User has no rights to perform this action\n            612 — The user does not have access to update a protected location note header"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
        '404':
          description: "The requested resource does not exist on the server.\n            <br/>Error codes:\n            611 — The location note header does not exist on the subscriber instance"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
        '500':
          description: "The server was unable to complete the request due to an internal error.\n            <br/>Error codes:\n            501 — Object reference not set to an instance of an object"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
      deprecated: false
      x-access: Subscribers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceChannel.Services.Messaging.LocationNote.UpdateLocationNoteHeaderApiModelRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ServiceChannel.Services.Messaging.LocationNote.UpdateLocationNoteHeaderApiModelRequest'
        description: Request to add, update or delete a location note header for a location.
        required: true
  /locations/{storeId}/updateNotes:
    post:
      tags:
      - Locations
      summary: Add location notes
      description: 'Add location notes for the specified location. If a note is already added, you can change it by sending the request, or leave the `Value` parameter empty to delete the note.


        ***Note***: To retrieve store IDs along with the location notes, send either of these requests: GET/stores, GET/locations.

        Get location notes separately for the specified location by sending the GET/locations/{locationId}/notes request.


        **Example request**


        POST /locations/{storeId}/updateNotes

        {

        "Notes": [

        {

        "Header": "Note1",

        "Value": "1"

        },

        {

        "Header": "Note2",

        "Value": "2"

        }

        ]

        }'
      operationId: POSTv3_locations_{storeId}_updateNotes
      parameters:
      - name: storeId
        in: path
        description: Unique storeId of the location you want to update a note for.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The note is added to the specified location.
        '400':
          description: "The request is not accepted due to bad syntax, missing parameters, insufficient data, etc.\n            <br/>Error codes:\n            601 — Location is not found\n            1301 — Request is empty or null"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
        '401':
          description: "The request is not authorized.\n            <br/>Error codes:\n            504 — API call rejected by security permissions"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
        '403':
          description: "You are not authorized to request this resource, or the resource is unavailable for some reason.\n            <br/>Error codes:\n            100 — User has no rights to perform this action\n            612 — The user does not have access to update a protected location note header"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
        '404':
          description: "The requested resource does not exist on the server.\n            <br/>Error codes:\n            611 — The location note header does not exist on the subscriber instance"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
        '500':
          description: "The server was unable to complete the request due to an internal error.\n            <br/>Error codes:\n            501 — Object reference not set to an instance of an object"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
      deprecated: false
      x-access: Subscribers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceChannel.Services.Messaging.LocationNote.UpdateLocationNoteHeadersApiModelRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ServiceChannel.Services.Messaging.LocationNote.UpdateLocationNoteHeadersApiModelRequest'
        description: Request to add, update or delete a location note headers for a location.
        required: true
  /locations/UnassignedContracts:
    get:
      tags:
      - Locations
      summary: Get unassigned contracts
      description: 'Returns subscriber’s locations with open trades that have unassigned providers.


        ***Note***: Method could be outdated causing faulty results.'
      operationId: GETv3_locations_UnassignedContracts
      responses:
        '200':
          description: The requested locations are in the response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.Location.GetProviderAssignmentExtendedLocationsResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.Location.GetProviderAssignmentExtendedLocationsResponse'
        '400':
          description: The request is not accepted due to bad syntax, missing parameters, insufficient data, etc.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
        '401':
          description: "The request is not authorized.\n            <br/>Error codes:\n            504 — API call rejected by security permissions"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
        '404':
          description: The requested resource does not exist on the server.
      deprecated: false
      x-access: Any
  /locations/{locationId}/evacuationmaps:
    get:
      tags:
      - Locations
      summary: Get an evacuation plan map of a location
      description: 'Returns evacuation plan map attachments details for the specified location.


        Visit ServiceChannel University to learn about Location Emergency Evacuation Plan Map(s).'
      operationId: GETv3_locations_{locationId}_evacuationmaps
      parameters:
      - name: locationId
        in: path
        description: Unique numeric identifier of the location to return the details for.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Location evacuation plan maps are in the response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.Location.GetLocationAttachmentsResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.Location.GetLocationAttachmentsResponse'
        '401':
          description: "The request is not authorized.\n            <br/>Error codes:\n            504 — API call rejected by security permissions"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
        '500':
          description: The server was unable to complete the request due to an internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.ErrorResponse'
      deprecated: false
      x-access: Any
  /locations/CheckIfLocationIsOpen:
    get:
      tags:
      - Locations
      summary: Check whether the location is open or closed
      description: 'Returns information on the specified location if it is open or closed now. If the `checkTime` parameter is not provided, the location is checked at the current time.


        Learn about managing business hours in ServiceChannel University.'
      operationId: GETv3_locations_CheckIfLocationIsOpen?locationId={locationId}&checkTime={checkTime}
      parameters:
      - name: locationId
        in: query
        description: Unique location identifier
        required: true
        schema:
          type: integer
          format: int32
      - name: checkTime
        in: query
        description: Date and time to check if the location is open
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: The location opening status is in the response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.AfterHours.CheckIfLocationIsOpenResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ServiceChannel.Services.Messaging.AfterHours.CheckIfLocationIsOpenResponse'
      deprecated: false
      x-access: Any
  /GetFilteredLocations:
    post:
      tags:
      - Locations
      summary: Get locations by filters
      description: 'Returns locations based on the filters applied.

        By default closed locations are not included in the response. To include them, set the `IncludeClosedLocations` parameter to `true`.'
      operationId: POSTv3_GetFilteredLocations
      responses:
        '200':
          description: The filtered locations are in the response.
          content:
            application/json:
              schema:
                type: array
                items:

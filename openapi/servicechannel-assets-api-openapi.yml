    ServiceChannel.Services.Messaging.Assets.AssetTagScanAuditRecord:
      description: Holds information about scanned asset tags.  This class must be kept in sync with ContractorTools.BL.Models.AssetTagScanAuditRecord.
      required:
      - AssetID
      - TrackingNumber
      type: object
      properties:
        AssetID:
          format: int32
          description: Unique numeric identifier of the scanned asset. Must be greater than 0.
          type: integer
        TrackingNumber:
          format: int32
          description: Tracking number of the work order associated with the scanned asset. Must be greater than 0.
          type: integer
        WorkOrderID:
          description: Unique numeric identifier of the work order associated with the scanned asset.
          type: string
        AssetTagStatus:
          description: "Validation status of the scanned asset tag. Possible values:\n             • `0`=`Unknown`: Validation status is not determined.\n             • `1`=`NotAvailable`: Asset tag does not exist or cannot be scanned.\n             • `2`=`NotValidated`: Asset tag exists, but validation failed.\n             • `3`=`PendingValidation`: Asset tag has been scanned and is awaiting validation.\n             • `4`=`Validated`: Asset tag has been successfully validated."
          enum:
          - Unknown
          - NotAvailable
          - NotValidated
          - PendingValidation
          - Validated
          type: string
        ManuallyEntered:
          description: 'Indicates whether the asset tag value was entered manually instead of being scanned. Possible values: `true` and `false`.'
          default: false
          type: boolean
        AssetTagNotScannedReason:
          description: Free‑text explanation of why the tag was not scanned. Must not exceed 50 characters.
          type: string
        ValidationRequired:
          description: 'Indicates whether this asset requires asset tag validation. Possible values: `true` and `false`. To check whether validation is required, run the [GET/assets/{trackingNumber}/IsValidationRequired](https://developer.servicechannel.com/swagger/index.html#/Assets/GETv3_assets_%7BtrackingNumber%7D_IsValidationRequired) method.'
          default: false
          type: boolean
        AssetValidated:
          description: 'Indicates whether the asset has been successfully validated. Possible values: `true` and `false`.'
          default: false
          type: boolean
        UnableToValidateReasonId:
          format: int32
          description: "Standardized reason code defining why validation could not be completed. Possible values:\n             • `1`: Cannot find the asset in the database\n             • `2`: Cannot find the asset on site \n             • `3`: New asset\n             • `4`: Other (requires explanation in `OtherReason`)\n            To check the reasons and their IDs, run the [GET/assets/UnableToValidateReasons](https://developer.servicechannel.com/swagger/index.html#/Assets/GETv3_assets_UnableToValidateReasons) method."
          type: integer
        OtherReason:
          description: Free-text explanation of why validation failed. Required when `UnableToValidateReasonId` = `4` (Other).
          type: string
        UnableToScanReasonId:
          format: int32
          description: "Standardized reason code defining why scanning could not be completed. Possible values:\n             • `1`: Tag Missing\n             • `2`: Tag Damaged\n             • `3`: Scanner Problem\n             • `4`: Other\n            To get the reason codes, run the [GET/assets/UnableToScanReasons](https://developer.servicechannel.com/swagger/index.html#/Assets/GETv3_assets_UnableToScanReasons%3FsubscriberId%3D%7BsubscriberId%7D) method."
          type: integer

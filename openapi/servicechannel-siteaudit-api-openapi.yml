        format: date-time
        description: Date and time when the comment was added to the checklist item. The format is YYYY-MM-DDThh:mm:ss.sss.
        type: string
      Description:
        description: Text of the comment added to the checklist item during the audit.
        type: string
      Persistent:
        description: "Shows whether the comment should be saved for future audits. Possible input values:\r\n             • `true`: To save the checklist item comment for future audits, set the parameter value to `true`.\r\n             • `false`: When the comment should not be preserved and displayed for future audits, set the parameter value to `false`."
        default: false
        type: boolean
      Attachments:
        description: Images or videos attached to the checklist item during the inspection.
        type: array
        items:
          $ref: '#/definitions/ServiceChannel.Services.Messaging.SiteAudit.UpdatedAuditIssueAttachmentExternal'
  System.Object:
    type: object
    properties: {}
  ServiceChannel.Services.Messaging.SiteAudit.SavedAuditInfoExternal:
    description: General details of a completed audit.
    type: object
    properties:
      Id:
        format: int32
        description: Unique numeric identifier of the site audit.
        type: integer
      StoreId:
        format: int32
        description: Unique numeric identifier of the location where the site audit was conducted.
        type: integer
      UserId:
        format: int32
        description: Unique numeric identifier of the user (auditor) who conducted the site audit.
        type: integer
      UserName:
        description: Display name of the user (auditor) who conducted the site audit.
        type: string
      TemplateTypeId:
        format: int32
        description: Unique numeric identifier of the template that was used to complete the site audit. The template determines the audit type.
        type: integer
      StartDate:
        format: date-time
        description: Date and time when the user started the audit in the SC Mobile app or in Service Automation. The format is `YYYY-MM-DDThh:mm:ss.ss`.
        type: string
      FinishDate:
        format: date-time
        description: Date and time when the site audit was completed. The format is `YYYY-MM-DDThh:mm:ss.ss`.
        type: string
      FinishDateStr:
        description: Date when the site audit was completed. The format is `MMM DD, YYYY`.
        type: string
      Status:
        description: "Unique numeric identifier of the status. Possible response values:\r\n             • `1`: The site audit status is *Open*.\r\n             • `2`: The site audit status is *Completed*."
        enum:
        - Undefined
        - Open
        - Completed
        type: string
      Emails:
        description: Email address(es) to which the audit results were sent out by the auditor upon completing the audit.
        type: string
      Areas:
        description: List of areas that were inspected during the site audit, for example, *Interior* or *Exterior*.
        type: array
        items:
          $ref: '#/definitions/ServiceChannel.Services.Messaging.SiteAudit.SavedAuditAreaExternal'

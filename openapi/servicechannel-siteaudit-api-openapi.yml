        type: integer
      Language:
        description: Language that was used to conduct the audit. Use the two-letter abbreviation, for example, **EN**.
        type: string
      SendEmails:
        description: "Specifies whether an email notification was sent out upon completing the site audit. Possible input values:\r\n             • `true`: The audit results were sent to the specified recipient(s). Use the `Emails` parameter to add the recipients.\r\n             • `false`: The audit results were not emailed to anyone."
        default: false
        type: boolean
      Emails:
        description: "Email address(es) to which the audit results were sent out upon completing the audit. Check the `Sent` parameter in the response to see whether the audit results were successfully sent out to the specified recipients.\r\n            <br />Learn more about the email list for site audits in [SCU](https://servicechannel.atlassian.net/wiki/spaces/SCU/pages/552173744/Configuring+an+Email+List+for+Site+Audit+Reports)."
        type: string
      Status:

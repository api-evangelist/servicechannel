  ServiceChannel.Services.Messaging.SiteAudit.SavedCheckListItemExternal:
    description: Information on the inspected checklist items.
    type: object
    properties:
      Id:
        format: int32
        description: Unique numeric identifier of the checklist item.
        type: integer
      Name:
        description: Item name, for example, *Hand dryer* or *Sink*.
        type: string
      Description:
        description: Detailed description/instruction for the checklist item.
        type: string
      Score:
        format: int32
        description: "Shows how the checklist item was rated. The response value depends on the rating system applied.\r\n             • `-1`: The item was marked as **Not applicable**.\r\n             • `1`: In the **Pass/Fail** rating system, it stands for the **Fail** answer.\r\n             • `2`: In the **Pass/Fail** rating system, it stands for the **Pass** answer.\r\n             • `numeric value`: In the **Weighted** rating system, a custom numeric value is assigned to each option: **Good**, **Fair**, and **Fail**.\r\n             • `0–10`: In the **Numeric** rating system, a value from 0 to 10 can be used to rate the item.\r\n             • `0–100`: In the **Percentage** rating system, a value from 0% to 100% can be used to rate the item."
        type: integer
      System:
        format: int32
        description: "Rating system that was applied to the checklist item. Possible response values:\r\n             • `1`: For the **Pass/Fail** rating system\r\n             • `2`: For the **Numeric** rating system\r\n             • `3`: For the **Weighted** rating system\r\n             • `4`: For the **Percentage** rating system. When this rating system is used, the `Score` value is displayed in percentages.\r\n            <br />Learn more about each rating system in [SCU](https://servicechannel.atlassian.net/wiki/spaces/SCU/pages/550928611/Building+a+Site+Audit+in+an+Excel+Template)."
        type: integer
      Date:
        format: date-time
        description: Date and time when the checklist item was inspected and rated. The format is `YYYY-MM-DDThh:mm:ss.sss`.
        type: string
      DateStr:
        description: Date when the checklist item was inspected and rated. The format is `MMM DD, YYYY`.
        type: string
      Unlisted:
        default: false
        type: boolean
      CheckListItemImpact:
        description: "Checklist item’s impact on the total audit score. Possible response values:\r\n             • `Veto`: Means that this item has the highest impact on the audit score. When at least one of the veto checklist items is rated as **Fail**, the total score of the audit drops to 1%.\r\n             • `Ignore`: Means that this item is ignored when the audit score is calculated.\r\n             • `Empty value`: When the method returns an empty value, it means that this checklist item is counted as a regular item."
        type: string
      UseNumericRatingSystem:
        default: false
        type: boolean
      PassThreshold:
        format: int32
        description: Minimum rating value that is sufficient to pass the audit. Can be in numbers or percentages based on the rating system applied to the checklist item. See the `System` parameter.
        type: integer
      Range:
        description: Range of numbers displayed to the user during the audit, allowing the auditor to rate the item. Permits selecting a score on a 0–10 scale or from 0% to 100%.
        type: array
        items:
          format: int32
          type: integer
      Issues:
        type: array
        items:
          $ref: '#/definitions/ServiceChannel.Services.Messaging.SiteAudit.SavedAuditIssueExternal'
      WorkOrderIds:
        description: Tracking numbers of the work orders created in the event of the checklist item inspection.
        type: array
        items:
          format: int32
          type: integer
      Quantity:
        $ref: '#/definitions/ServiceChannel.Services.Messaging.SiteAudit.SavedAuditQuantityExternal'
      PreviousAuditInfoList:
        type: array
        items:
          $ref: '#/definitions/ServiceChannel.Services.Messaging.SiteAudit.PreviousAuditInfoModelExternal'

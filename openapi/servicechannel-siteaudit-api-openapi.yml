        format: int32
        description: Unique numeric identifier of the template that was used to complete the site audit. The template determines the audit type.
        type: integer
      UserName:
        description: Username of the person who conducted the audit.
        type: string
      UnauditedItems:
        format: int32
        description: Number of checklist items that were not audited.
        type: integer

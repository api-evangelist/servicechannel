  /subscribers/current/siteaudit/audits/filtered:
    get:
      tags:
      - SiteAudit
      summary: Get the list of filtered site audits
      description: Allows filtering site audits by status, location ID, location name, username, and audit type. Returns filtered audits for the last 30 days.
      operationId: GETv3_subscribers_current_siteaudit_audits_filtered?searchValue={searchValue}&status={status}&pageIndex={pageIndex}&pageSize={pageSize}&startDate={startDate}&endDate={endDate}
      consumes: []
      produces:
      - application/json
      - text/json
      parameters:
      - name: searchValue
        in: query
        description: "Text field where the following search criteria can be entered:\r\n             • Location ID as specified by the subscriber in the location details\r\n             • Location name\r\n             • Username\r\n             • Audit type\r\n            <br />The value you enter will be searched for across all these 4 criteria."
        required: false
        type: string
      - name: status
        in: query
        description: 'Site audit status: *Open*, *Completed*, *Undefined*.'
        required: false
        type: string
        enum:
        - Undefined
        - Open
        - Completed
      - name: pageIndex
        in: query
        description: Sequence of pages. Enter `1` to view the first page; enter `2` to view the next page; etc.
        required: false
        type: integer
        format: int32
      - name: pageSize
        in: query
        description: Number of site audits that should be displayed in the response. No limits per page. When left empty, the default number of 20 audits is used.
        required: false
        type: integer
        format: int32
      - name: startDate
        in: query
        description: Optional start date for filtering audits. If provided, only audits created or completed after this date will be included.
        required: false
        type: string
        format: date-time
      - name: endDate
        in: query
        description: Optional end date for filtering audits. If provided, only audits created or completed before this date will be included.
        required: false
        type: string
        format: date-time

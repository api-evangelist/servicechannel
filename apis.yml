aid: servicechannel
name: ServiceChannel
description: >-
  ServiceChannel is a facilities-management platform that lets multi-location
  brands automate work orders, dispatch and manage service providers, track
  physical assets, and process contractor invoices across restaurants, retail,
  grocery, healthcare, and hospitality. Its developer platform exposes a large
  REST API surface — the Service Automation API (v3) with 742 operations plus
  the Fixxbook provider-directory API — secured with OAuth2, with webhook
  notifications, a documented error-code registry, and a public developer
  portal. Added to the API Evangelist network from an accel portfolio lead and
  enriched from the live developer surface.
url: https://raw.githubusercontent.com/api-evangelist/servicechannel/refs/heads/main/apis.yml
